# El registro de accesos, apagado a propósito.
#
# La consulta que llega aquí lleva las coordenadas del jugador dentro del cuerpo, y la
# línea de acceso llevaría además su dirección IP y la fecha. Es la mitad servidor del
# escenario bloqueante «Las coordenadas salen una sola vez, al generar el mapa»: si esto
# se queda con el log por defecto, la afirmación es falsa y nada en el código lo delata.
#
# `error_log` se deja en `crit`: sin él, un fallo de la máquina no deja ni rastro y la
# sonda se queda como único instrumento. A nivel crítico no escribe peticiones, solo
# fallos del servidor.
access_log off;
error_log /dev/stderr crit;
