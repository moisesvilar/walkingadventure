# @app — Empezar de nuevo dentro del móvil (SPEC-040).
#
# **Recorre su pantalla desde el 10-ago-2026.** Hasta la fila 43 este flujo llevaba
# `@limite-declarado`: no había ninguna puerta hasta A6P6 y lo único que ejecutaba era
# una guarda que comprobaba que la pantalla seguía sin existir. Ahora `App.js` monta el
# momento de consulta y la puerta es la del pie de la portada, así que **este flujo entra
# por donde entra una persona** y su verde vale lo que dice.
#
# Se llega recorriendo el arranque entero, que es el único camino a la portada, y por eso
# empieza reutilizando `arranque.yaml` en vez de copiarlo.
#
# Aquí vive **solo lo que necesita dispositivo**. Lo que se pierde enumerado en cosas, que
# una partida del primer día no enumere ceros, que un mapa sin título falle nombrándolo,
# que la copia se ofrezca y no se haga sola, que una copia fallida o cancelada no borre
# nada, la marca de borrado, su remate al abrir y que no quede ninguna clave ni la semilla
# son afirmaciones sobre **datos** y se comprueban en `test/nucleo/borrado.test.mjs` sin
# simulador — es el reparto que eligió la spec, y por eso este flujo es corto. Lo que no
# se puede ver sin dispositivo es:
#
# 1. **Que lo destructivo no sea el botón principal**: guardar una copia va arriba y es la
#    sólida; borrar sin guardar nada es hueca y con el color de lo destructivo. El dato
#    dice el orden y el peso; que el gesto fácil no sea el que borra se ve mirándolo.
# 2. **Que «Dejarlo como está» no desaparezca en ningún estado**, tampoco mientras se
#    empaqueta la copia, que es el único momento en que las otras dos no están.
# 3. **Que no haya casilla, texto que teclear, cuenta atrás ni segundo aviso**: son
#    ausencias en pantalla, y una ausencia solo se afirma mirando la pantalla entera.
# 4. **Que borrar lleve a la primera pantalla del arranque**, y que ese arranque sea el de
#    una instalación nueva, sin ningún atajo ni ninguna mención a la partida anterior.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesitaba y ya tiene**, de la fila 43: la puerta hasta A6P6 y de
# ahí a A6P7, con el «dejarlo como está» y el atrás del sistema llevando los dos a los
# ajustes.
#
# **Lo que todavía le falta, y de quién es:**
#
# - **Una partida con dos mapas y con diario**, porque la enumeración de lo que se pierde
#   se compone en tiempo de ejecución. Con la partida del día uno la frase nombra el
#   personaje y el mapa levantado, y no hay ni diario ni segundo mapa que enumerar — que
#   es correcto y es lo que se afirma aquí. Los caminos con dos mapas y con días apuntados
#   son de la **fila 47**, que carga un documento de partida al arrancar.
# - **La hoja de compartir del sistema**, para el camino de guardar una copia primero. En
#   el emulador se cancela, que además es el caso que interesa mirar: las tres acciones
#   vuelven y la partida sigue.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que la sans sea la sans.** Maestro no compara tipografías. Lo que sí se puede
#   afirmar es el registro que declara la pantalla, y eso ya está en `@nucleo`, donde
#   además no se desactualiza.
# - **Que el rojo sea el rojo de la marca.** Tampoco se leen colores desde aquí; lo que se
#   afirma es que la acción destructiva está y que no es la principal.
#
# Los elementos se localizan por los identificadores que declara la spec —`momento`,
# `empezar-de-nuevo`, `empezar-de-nuevo-perdida`, `empezar-de-nuevo-congelado`,
# `empezar-de-nuevo-guardar`, `empezar-de-nuevo-borrar`, `empezar-de-nuevo-dejarlo`,
# `empezar-de-nuevo-estado`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Se explica que el mundo no se puede rehacer»
#   «La copia se ofrece pero no se hace sola»
#   «Borrar lleva al arranque»
#
appId: com.walkingadventure.app
---
# A la portada se llega saliendo del arranque, que hoy es el único camino. El flujo del
# arranque ya está escrito y se reutiliza entero en vez de copiarlo.
- runFlow:
    file: arranque.yaml

- tapOn:
    id: 'puerta-ajustes'
- tapOn: 'Empezar de nuevo'

# ── Se explica que el mundo no se puede rehacer ────────────────────────────────
# La pantalla es la de consulta de los ajustes, y sus tres bloques están.

- assertVisible:
    id: 'empezar-de-nuevo'
- assertVisible:
    id: 'momento'
- assertVisible: 'de-consulta'
- assertVisible:
    id: 'empezar-de-nuevo-estado'
- assertVisible: 'preguntando'
- assertVisible: 'Empezar de nuevo'
- assertVisible: '‹ Ajustes'

- assertVisible:
    id: 'empezar-de-nuevo-perdida'
- assertVisible: '.*Se pierde todo esto.*'
- assertVisible: '.*No se puede deshacer.*'
- assertVisible:
    id: 'empezar-de-nuevo-congelado'
- assertVisible: '.*esos datos ya han cambiado.*'
- assertVisible: '.*otro sitio, con otros nombres.*'
- assertVisible: '.*se puede volver a abrir cuando quieras.*'

# ── No hay segundo aviso, ni casilla, ni texto que teclear, ni cuenta atrás ────
# Ausencias, que es lo que solo se puede afirmar mirando la pantalla entera.

- assertNotVisible: 'Confirmar'
- assertNotVisible: 'Escribe'
- assertNotVisible: 'Estoy seguro'
- assertNotVisible: '¿Seguro?'
- assertNotVisible: 'Sí, borrar'
- assertNotVisible: 'Cancelar'

# ── Las tres acciones, y cuál es la principal ─────────────────────────────────
# El orden y el peso van en el dato; lo que se mira aquí es que las tres están y que la
# destructiva no es la que se toca sin querer.

- assertVisible:
    id: 'empezar-de-nuevo-guardar'
- assertVisible: 'Guardar una copia primero'
- assertVisible:
    id: 'empezar-de-nuevo-borrar'
- assertVisible: 'Borrar sin guardar nada'
- assertVisible:
    id: 'empezar-de-nuevo-dejarlo'
- assertVisible: 'Dejarlo como está'

# ── La copia se ofrece pero no se hace sola ───────────────────────────────────
# Se toca guardar una copia: la espera se cuenta con una línea y sin cifra, y «dejarlo
# como está» sigue estando mientras las otras dos no están.

- tapOn:
    id: 'empezar-de-nuevo-guardar'
- assertVisible: 'Preparando la copia…'
- assertVisible:
    id: 'empezar-de-nuevo-dejarlo'
- assertNotVisible: '%'
- assertNotVisible: 'por ciento'

# La hoja del sistema se cancela: no se ha guardado nada, **no se borra nada** y las tres
# acciones vuelven tal cual.
- back
- assertVisible: 'No se ha guardado nada'
- assertVisible: 'Tu partida sigue como estaba'
- assertVisible:
    id: 'empezar-de-nuevo-estado'
- assertVisible: 'preguntando'
- assertVisible:
    id: 'empezar-de-nuevo-guardar'
- assertVisible:
    id: 'empezar-de-nuevo-borrar'
- assertVisible:
    id: 'empezar-de-nuevo-dejarlo'

# Y dejarlo como está vuelve a los ajustes sin haber tocado nada: la fila sigue ahí.
- tapOn:
    id: 'empezar-de-nuevo-dejarlo'
- assertVisible:
    id: 'ajustes-lista'
- assertVisible: 'Empezar de nuevo'

# ── Borrar lleva al arranque ──────────────────────────────────────────────────
# Se entra otra vez —la partida sigue entera, así que la pantalla se compone igual— y esta
# vez se borra sin guardar nada. No hay un segundo aviso encima del aviso.

- tapOn: 'Empezar de nuevo'
- assertVisible:
    id: 'empezar-de-nuevo-perdida'
- tapOn:
    id: 'empezar-de-nuevo-borrar'
- assertNotVisible: '¿Seguro?'
- assertNotVisible: 'Sí, borrar'

# Se llega a la primera pantalla del arranque, y es la de una instalación nueva: A1P1,
# la primera de las cinco, con el contador en 1/5 y sin ninguna huella de la anterior.
- assertVisible:
    id: 'arranque'
- assertVisible:
    id: 'arranque-paso'
- assertVisible: 'quien-eres'
- assertVisible: '1/5'
- assertNotVisible:
    id: 'empezar-de-nuevo'
- assertNotVisible: 'Sabela'
- assertNotVisible: 'Marcas de Vaeloria'
- assertNotVisible: 'Seguir'
- assertNotVisible: 'Continuar donde lo dejaste'
- assertNotVisible: 'El mismo mundo otra vez'
- assertNotVisible: 'Recuperar la partida'

# Y volver a lanzar la app sigue llevando al arranque: no queda partida que abrir.
- launchApp:
    clearState: false
- assertVisible:
    id: 'arranque'
- assertVisible: '1/5'
- assertNotVisible: 'Sabela'
