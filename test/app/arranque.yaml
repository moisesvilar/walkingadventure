# @app — El arranque dentro del móvil (SPEC-027).
#
# Aquí vive **solo lo que necesita dispositivo**: que las siete pantallas se monten en
# orden de verdad, que la flecha de atrás exista en las cinco que la llevan y no en las
# dos últimas, que el pin se pueda arrastrar con el dedo, que el diálogo del sistema
# aparezca al pulsar «Permitir», y que la pantalla de generación no enseñe ninguna
# cifra. Todo lo demás de esta fila —la secuencia, el precubierto, la reanudación, el
# sorteo de nombres, el filtro del escrito a mano, la permanencia del oficio, el
# anclaje redondeado, los ajustes de origen y el guion entero— se afirma en
# `test/nucleo/onboarding.test.mjs` y `test/nucleo/personaje.test.mjs`, que corren sin
# simulador. Duplicar aquí lo que ya se puede poner rojo en Node solo añadiría un flujo
# lento que se cae por el entorno.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesita para pasar**: la app montada por `ArranqueMontado`, el
# proxy alcanzable desde el simulador (`EXPO_PUBLIC_PROXY`) con el Overpass del
# proyecto detrás, y una instalación limpia — el arranque solo se recorre entero la
# primera vez.
#
# **Lo que este flujo NO puede comprobar todavía, y por qué:**
#
# - **Denegar en el diálogo nativo, en las dos plataformas.** Ningún automatismo lo
#   provoca de forma fiable: es `@manual`, y así lo declara la spec. Conceder sí se
#   recorre aquí desde SPEC-048 (ver A1P3).
# - **Que la marca de A1P4 caiga en la posición que dio el sensor.** El fijo que entrega
#   el emulador depende de lo que tenga puesto `adb emu geo fix` en ese momento, y una
#   afirmación sobre la coordenada convertiría el estado del emulador en el resultado de
#   la prueba. Lo que sí se afirma es lo que distingue las dos vías: `permiso-respuesta`
#   dice `concedido` y **no** `no-se-pudo-preguntar`, y el origen del punto se afirma en
#   `test/nucleo/onboarding.test.mjs`, que corre sin dispositivo.
# - **El mapa real de A1P4.** No hay capa de teselas —misma razón—, así que la
#   superficie declara `sin-mapa-real`. Lo que sí se ejercita es el gesto: la marca y
#   el círculo se pintan encima y son de la pantalla, no de ninguna librería.
#
# Los elementos se localizan por los identificadores que declara la spec —`arranque`,
# `arranque-paso`, `nombre-campo`, `oficio-<id>`, `tramo-<id>`, `permiso-a-mano`,
# `punto-pin`, `punto-generar`, `generacion-fases`, `primera-lista`— y nunca por su
# posición en pantalla.

# El caso, tal y como lo cita `test/spec-test-map.json`:
#   «El arranque recorre las siete pantallas en orden en el dispositivo»
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

- assertVisible:
    id: 'arranque'
- assertNotVisible:
    id: 'arranque-sin-cablear'

# El momento del sistema de diseño —«antes de salir»— y el paso en curso NO se afirman
# aquí, y no por dejadez: `arranque.jsx` los declara como dos `View` con
# `estilos.marca = { position: 'absolute', width: 0, height: 0 }`, y un nodo de cero por
# cero **no existe para ninguna automatización de interfaz**. Medido: el árbol de
# accesibilidad los trae con `boundsInScreen: Rect(0, 0 - 0, 0)` y `visible: false`, y
# Maestro los descarta con «Skipping invisible child» antes de que ningún selector los
# vea. `assertVisible` sobre ellos no puede pasar nunca, en ninguna máquina, hoy ni
# arreglando el entorno: no es un rojo que se pueda perseguir.
#
# Lo que sí se comprueba, y donde de verdad se puede poner rojo, es el vocabulario de
# momentos, que vive en el paquete y lo afirma `test/nucleo/narrador.test.mjs`
# («MOMENTOS_DE_SALIDA»). Que además se pinte una marca en pantalla solo sería
# comprobable el día que la marca tenga tamaño; queda anotado como defecto de la app.

# ── A1P1 · Quién eres ──────────────────────────────────────────────────────────
#
# La cabecera lleva flecha y contador en las cinco primeras pantallas, y el contador
# dice el paso sobre cinco (SPEC-027: «en cualquiera de los cinco primeros pasos …
# lleva flecha de atrás y contador»). **A1P1 la lleva**: que la flecha exista aquí es
# lo que hace que arrepentirse del nombre no sea una puerta cerrada.
#
# Este bloque decía que estas tres líneas estaban rojas a propósito porque la cabecera
# se pintaba **debajo de la barra de estado** —flecha en `Rect(53, 32 - 116, 124)`, con
# la barra midiendo ~100 px—, por el `SafeAreaView` de `react-native`, que solo hace
# algo en iOS. **Ese defecto ya no está y el texto se corrige en lugar de arrastrarlo**:
# medido ahora en el mismo dispositivo, la flecha ocupa `[53,160][116,252]` y el «1/5»
# `[115,182][169,229]`, los dos por debajo de los 128 px de la barra, y las tres líneas
# pasan. Dejar puesto que son «rojas a propósito» haría que un rojo de verdad en la
# cabecera se leyera como el defecto viejo ya conocido.
- assertVisible:
    id: 'arranque-contador'
- assertVisible: '1/5'
- assertVisible:
    id: 'arranque-atras'

# El campo llega relleno y las cuatro sugerencias están a la vista, sin abrir nada.
- assertVisible:
    id: 'nombre-campo'
- assertVisible:
    id: 'nombre-sugerencias'
- assertVisible:
    id: 'nombre-resortear'
- assertVisible: '¿Quién vas a ser ahí dentro?'

# El género llega en femenino y se cambia en un toque, sin desplegable.
- assertVisible:
    id: 'genero-femenino'
- assertVisible:
    id: 'genero-masculino'

# El oficio se marca y **se despliega en su sitio**: no abre otra pantalla.
- assertVisible:
    id: 'oficios'
- assertNotVisible:
    id: 'oficio-implicacion'
- tapOn:
    id: 'oficio-taberna'
- assertVisible:
    id: 'oficio-implicacion'
- assertVisible:
    id: 'arranque'

# La lista desplaza y la pantalla no cambia de forma: el desplazamiento está para que
# crecer no rompa el diseño, no para esconder nada.
- scrollUntilVisible:
    element:
      id: 'oficio-mercado'
    direction: DOWN
- assertVisible:
    id: 'arranque-seguir'
- assertVisible:
    id: 'oficios'

# Ni una cifra en toda la pantalla, y ninguna pregunta por la edad.
- assertNotVisible: '.*\d+\s*(m|km|min|minutos|pasos|%).*'
- assertNotVisible: '.*[Ee]dad.*'
- assertNotVisible: '.*[Aa]ños.*'

- tapOn:
    id: 'arranque-seguir'

# ── A1P2 · Tu tramo ────────────────────────────────────────────────────────────
- assertVisible: '2/5'
- assertVisible:
    id: 'tramo-respuestas'
- assertVisible:
    id: 'tramo-vuelta-de-la-esquina'
- assertVisible:
    id: 'tramo-par-de-manzanas'
- assertVisible:
    id: 'tramo-otro-barrio'
- assertVisible:
    id: 'tramo-pueblo-de-al-lado'
# Cuatro sitios a los que se llega, y ni un metro. Ni la palabra accesibilidad, ni una
# opción para quien va en silla.
- assertNotVisible: '.*\d+\s*(m|km|metros|minutos).*'
- assertNotVisible: '.*[Aa]ccesibilidad.*'
- tapOn:
    id: 'tramo-otro-barrio'

# La vuelta atrás existe y lo contestado sigue puesto: es lo que hace que arrepentirse
# del nombre no sea una puerta cerrada.
- tapOn:
    id: 'arranque-atras'
- assertVisible: '1/5'
- assertVisible:
    id: 'oficio-implicacion'
- tapOn:
    id: 'arranque-seguir'
- assertVisible: '2/5'
- tapOn:
    id: 'arranque-seguir'

# ── A1P3 · El permiso ──────────────────────────────────────────────────────────
- assertVisible: '3/5'
- assertVisible:
    id: 'permiso-alcance'
- assertVisible: 'Ubicación · mientras usas la app'
- assertVisible: 'Nunca en segundo plano. Si la app no está abierta, el juego no puede seguirte.'
# La alternativa se enseña **antes** de que el sistema pregunte: después la convertiría
# en un rescate y sugeriría que denegar fue un error.
- assertVisible:
    id: 'permiso-permitir'
- assertVisible:
    id: 'permiso-a-mano'

# Antes de pedir nada, la marca dice `sin-pedir`. Es lo que hace afirmable que denegar y
# no poder preguntar se ven distintos: las tres respuestas viven en el mismo sitio.
- assertVisible:
    id: 'permiso-respuesta'
- assertVisible: 'sin-pedir'
# Y hay con qué pedirlo: desde SPEC-048 el módulo de ubicación está en la compilación, así
# que «Permitir» no sale apagado. Si saliera apagado, esta línea lo dice con su nombre en
# vez de dejar que el flujo se vaya por la vía manual como si fuera una elección.
- assertVisible:
    id: 'ubicacion-estado'
- assertVisible: 'montado'
- assertNotVisible:
    id: 'permiso-permitir-motivo'

- tapOn:
    id: 'permiso-permitir'

# El diálogo del sistema. Va condicionado y **se localiza por el identificador del
# controlador de permisos de Android, no por su texto**: el diálogo lo escribe el sistema
# en el idioma del móvil, y una afirmación sobre «Ubicación» convertía el idioma del
# emulador en el resultado de la prueba (medido el 11-ago-2026: en `wa-pixel` sale en
# inglés y esta línea moría aquí). La condición existe porque el sistema **recuerda la
# respuesta**: con el permiso ya concedido de una tanda anterior no vuelve a preguntar, y
# `clearState` no siempre lo revoca.
- runFlow:
    when:
      visible:
        id: 'com.android.permissioncontroller:id/permission_allow_foreground_only_button'
    commands:
      # **«Mientras se usa» y ninguna otra puerta.** Que el diálogo no ofrezca «todo el
      # rato» es la exclusión 12 del PRD vista desde donde de verdad se rompe: si algún día
      # alguien enciende la ubicación de fondo en el plugin, este botón aparece y esto se
      # pone rojo. Es la mitad que `test/nucleo/pasos-de-fondo.test.mjs` no puede afirmar.
      - assertNotVisible:
          id: 'com.android.permissioncontroller:id/permission_allow_always_button'
      - tapOn:
          id: 'com.android.permissioncontroller:id/permission_allow_foreground_only_button'

# Conceder lleva a A1P4 y **no se queda en A1P3**: la respuesta se lee en la marca, que es
# nuestra y no depende del idioma del sistema. Lo que nunca puede salir de aquí es
# `no-se-pudo-preguntar`: eso sería que el proveedor no pudo ni preguntar, que es avería
# nuestra y se arregla en otro sitio.
- assertNotVisible: 'no-se-pudo-preguntar'

# La vía manual sigue entera y **sigue estando disponible**, que es la regla del arranque:
# se recorre solo si el permiso no llegó a concederse, porque con él concedido A1P3 ya ha
# quedado atrás.
- runFlow:
    when:
      visible:
        id: 'permiso-a-mano'
    commands:
      - tapOn:
          id: 'permiso-a-mano'

# ── A1P4 · Dónde se levanta ────────────────────────────────────────────────────
- assertVisible: '4/5'
- assertVisible:
    id: 'punto-mapa-real'
- assertVisible:
    id: 'punto-pin'
- assertVisible:
    id: 'punto-circulo'
- assertVisible:
    id: 'punto-irreversible'
- assertVisible: 'El mapa se genera aquí y se queda aquí. Es lo único del juego que no se deshace.'
# El texto que acompaña al círculo habla en palabras de camino: ni metros ni minutos.
- assertVisible: 'El tamaño sale de la dificultad que elegiste: te da para una tarde larga.'
- assertNotVisible: '.*\d+\s*(m|km|metros|minutos).*'
# Y no hay perilla de tamaño: el círculo es una consecuencia del tramo, no un control.
- assertNotVisible: '.*[Rr]adio.*'
- assertNotVisible: '.*[Zz]oom.*'

# La marca se arrastra de verdad. Es lo único de esta pantalla que necesita dedo.
- copyTextFrom:
    id: 'punto-pin'
- evalScript: ${output.pinInicial = maestro.copiedText}
- swipe:
    from:
      id: 'punto-pin'
    direction: RIGHT
- copyTextFrom:
    id: 'punto-pin'
- assertTrue: ${maestro.copiedText != output.pinInicial}

- tapOn:
    id: 'punto-generar'

# ── A1P5 · La generación ───────────────────────────────────────────────────────
# Desde aquí no se vuelve: ni flecha ni contador, y esa ausencia es la forma que toma
# en la interfaz el único invariante irreversible del juego.
- assertNotVisible:
    id: 'arranque-atras'
- assertNotVisible:
    id: 'arranque-contador'

# Las seis fases, una por línea. Va dentro de `runFlow` porque una celda que se levanta
# deprisa puede no dejar ver este momento, y eso no es un fallo.
- runFlow:
    when:
      visible:
        id: 'generacion-fases'
    commands:
      - assertVisible: 'Generando el mundo del juego'
      - assertVisible: 'Mirando qué hay por ahí'
      - assertVisible: 'Poniéndole nombre a todo'
      - assertVisible:
          id: 'generacion-prologo'
      # Ni barra, ni porcentaje, ni contador, ni estimación de segundos.
      - assertNotVisible: '.*\d+\s*%.*'
      - assertNotVisible: '.*\d+\s*(s|seg|segundos).*'
      - assertNotVisible: '.*[Qq]uedan.*'

# Al terminar se pasa sola a A1P6: no hay nada que pulsar.
- extendedWaitUntil:
    visible:
      id: 'mapa-lamina'
    timeout: 60000

# ── A1P6 · Tu mapa, el día uno ─────────────────────────────────────────────────
- assertVisible:
    id: 'trato'
- assertNotVisible:
    id: 'arranque-atras'
- assertNotVisible:
    id: 'generacion-fases'
- assertVisible:
    id: 'arranque-seguir'
- tapOn:
    id: 'arranque-seguir'

# ── A1P7 · La primera aventura ─────────────────────────────────────────────────
#
# **Once segundos medidos, y ninguna spec que se los presupueste.** Componer la primera
# lista —castear el reparto contra el mundo recién levantado y escribir lo que se cuenta—
# tarda 11 s en este dispositivo, y la espera por defecto de Maestro son 5. Por eso los
# tres flujos que entran a A1P7 morían exactamente aquí, todos con el mismo mensaje
# («Assertion is false: "Lo que se cuenta hoy" is visible»), y por eso se espera como se
# espera dos bloques más arriba para `mapa-lamina`: es espera, no lógica.
#
# Lo que el `extendedWaitUntil` arregla es el flujo. Lo que **no** arregla es lo que el
# flujo destapó: **ninguna spec le pone presupuesto a esta pantalla**. El minuto de
# RNF-PER-001 es el del levantamiento del mapa, no el de la lista, así que once segundos
# mirando una pantalla quieta después de pulsar «Seguir» no están ni cumplidos ni
# incumplidos: no están decididos. Es una decisión de producto pendiente y queda escrita
# aquí, no ablandada en silencio — el día que alguien le ponga número, este es el sitio
# donde el número tiene que caber.
- extendedWaitUntil:
    visible: 'Lo que se cuenta hoy'
    timeout: 60000
- assertVisible: 'Por aquí hay quien necesita algo'
- assertVisible:
    id: 'primera-lista'
- assertVisible:
    id: 'aventura-medida'

# **De aquí abajo se llega bajando, y no es cosmética.** A1P7 es un `ScrollView`
# (`LaPrimeraAventura`, `app/pantallas/arranque.jsx`) y **la lista del día uno no tiene
# longitud fija**: la componen las aventuras que el casting logre resolver contra el mundo
# recién levantado, y eso cambia de una ejecución a otra. Medido en este dispositivo: con
# cuatro tarjetas la lista llega a y=2242 de los 2277 útiles, y la regla del reloj, «andar
# sin nada» y «Salir a andar» —la acción principal de la pantalla, y la frontera de
# registro— quedan **por debajo del borde**; en otra tanda salió una sola aventura y cabía
# todo. Una prueba que solo pasa cuando la lista sale corta no afirma nada, y afirmar sin
# desplazarse convertía la longitud del reparto en el resultado de la prueba.
#
# Quien juega llega a estos textos bajando, y aquí se llega igual. `scrollUntilVisible` no
# ablanda nada —se sigue afirmando exactamente lo que se afirmaba, solo que después de
# alcanzarlo— y con lista corta no desplaza: para en cuanto el elemento ya se ve.
- scrollUntilVisible:
    element:
      id: 'andar-sin-nada'
    direction: DOWN
- assertVisible:
    id: 'andar-sin-nada'
- assertVisible: 'Y puedes salir a andar sin coger ninguna. El mundo se mueve igual.'
- assertNotVisible:
    id: 'arranque-atras'

# La frontera de registro: «Salir a andar» es el último texto que dice «nosotros». Va detrás
# de «andar sin nada» en la pantalla, así que con lista larga tampoco se ve al llegar.
- scrollUntilVisible:
    element:
      id: 'arranque-seguir'
    direction: DOWN
- assertVisible: 'Salir a andar'
- tapOn:
    id: 'arranque-seguir'

# Y el arranque queda cerrado: no se vuelve a entrar en él salvo por «empezar de nuevo».
- assertNotVisible:
    id: 'arranque-paso'
