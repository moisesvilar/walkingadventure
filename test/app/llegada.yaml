# @app — La llegada dentro del móvil (SPEC-032, cableada por SPEC-044).
#
# **Este flujo recorre su pantalla, y salió de la columna de límite declarado con la fila
# 44.** Hasta el 12-ago-2026 no había camino: primero porque `App.js` no montaba la llegada,
# y después —medido por esta misma batería— porque la capa de llegadas no llegaba a montarse
# en el dispositivo y ninguna escena podía validar. Las dos cosas están cerradas, y lo que
# hay aquí es el recorrido de verdad, medido y no supuesto.
#
# **Por dónde entra, que es por donde entra una persona.** Se recorre el arranque entero, se
# echa a andar desde la portada y **no se toca nada más**: la escena valida sola estando
# parada dentro del geofence del sitio por el que empieza el mapa, y se pone delante ella
# sola. Eso no es una comodidad del flujo — es exactamente lo que la spec pide («abrir la app
# enseña lo que corresponde al sitio donde estás») y lo que hace que la máquina sea un valor
# y no una pila de navegación. No hay ningún paso provisional al que saltar, y no lo va a
# haber.
#
# **Lo que NO se afirma aquí, y por qué. Las marcas de un punto no se pueden alcanzar.**
# `momento-estado`, `llegada-estado`, `llegada-secuencia`, `llegada-paso` y
# `llegada-movimientos` están en el árbol de accesibilidad —`adb shell uiautomator dump` las
# trae con su `content-desc`: `al-parar`, `ficha`, `lo-que-se-cuenta:encadenado`,
# `lo-que-se-cuenta`, `0`— y **Maestro las descarta**: `maestro hierarchy` sobre la misma
# pantalla entrega solo `llegada-montada`, `llegada`, `lo-que-se-cuenta` y `llegada-seguir`.
# Medido el 12-ago-2026 en `wa-pixel`, con el paquete de marcas ya en su capa propia y con
# `zIndex`/`elevation` puestos. Así que lo que este flujo afirma son elementos con tamaño y
# textos que se leen; el orden de la secuencia, su paso vigente y el estado del momento se
# afirman en `test/nucleo/llegadas.test.mjs`, que corre sin simulador. **Queda declarado como
# defecto de la app**, y es el mismo de siempre con otra forma: una marca que ninguna prueba
# puede leer no es una marca, es un comentario.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que la pantalla no se encienda estando el móvil bloqueado en el bolsillo.** Maestro no
#   ve el estado de la pantalla del sistema. Lo que sí se comprueba es la mitad
#   automatizable: que la escena aparece **sin haber tocado nada**, y que lo que emite la
#   llegada es la lista vacía de `LO_QUE_UNA_LLEGADA_EMITE`, en el núcleo.
# - **Que el háptico no vibre.** El simulador no vibra; es `@manual` y está en
#   `docs/testing.md`.
# - **El visor.** Sin lector de recursos binarios cableado toda llegada se resuelve como
#   ficha —`llegada-estado` dice `ficha` en el aparato—, así que el visor no se abre nunca
#   hoy. Es el límite que `test/app/visor.yaml` declara, y no es de este flujo.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «La escena queda disponible y espera»
#   «Sin beat, lo que se cuenta es la llegada entera»
#
appId: com.walkingadventure.app
---
# El arranque entero, que es por donde entra una persona. Deja la partida recién nacida con
# su mundo levantado alrededor de donde está.
- runFlow:
    file: arranque.yaml

# ── A2P1 · La portada, y echarse a andar ───────────────────────────────────────
- assertVisible:
    id: 'portada'
- assertVisible:
    id: 'salir-sin-mas'
- tapOn:
    id: 'salir-sin-mas'

# ── A3P1 · En marcha ───────────────────────────────────────────────────────────
#
# Abrir la salida arranca el servicio en primer plano y pide una posición puntual, así que
# se espera en vez de afirmar a la primera: es espera, no lógica.
- extendedWaitUntil:
    visible:
      id: 'en-marcha'
    timeout: 30000
# El momento se montó de verdad, y la capa de llegadas también: si no se hubiera podido
# montar, la salida no se habría abierto y la portada diría `llegadas-sin-cablear`.
- assertNotVisible:
    id: 'en-marcha-sin-cablear'
- assertNotVisible:
    id: 'llegada-sin-cablear'
- assertVisible:
    id: 'mapa-lamina'

# ── La escena valida sola y espera ─────────────────────────────────────────────
#
# **Aquí no se toca nada.** Validar es un estado y nunca un gesto: quien juega está parada
# dentro del geofence del sitio por el que empieza el mapa, se cumple la permanencia y la
# escena se pone delante ella sola. Medido: veintitrés segundos desde que se abre la salida.
# El plazo es generoso a propósito —el fijo del emulador llega cada cinco segundos y la
# ventana de parada necesita cubrirse—, y sigue siendo espera y no lógica.
- extendedWaitUntil:
    visible:
      id: 'llegada'
    timeout: 90000
- assertVisible:
    id: 'llegada-montada'

# ── A4P5 · Lo que aquí se cuenta ───────────────────────────────────────────────
#
# El sitio es un núcleo y no se ha venido a nada, así que **la llegada entera es lo que allí
# se cuenta**: es el paso encadenado único de la secuencia, y el antetítulo nombra el sitio.
- assertVisible:
    id: 'lo-que-se-cuenta'
- assertVisible: '.*se habla de'
- assertVisible: 'Queda anotado en tu diario, con el sitio y el momento.'
# Sin nada que se cuente de la jugadora, la sección «Y de ti» no existe: no se enseña vacía.
- assertNotVisible:
    id: 'lo-que-se-cuenta-de-ti'

# ── Ninguna de estas pantallas se navega ───────────────────────────────────────
# No hay barra, no hay flecha de atrás entre pasos y no hay manera de saltar al siguiente.
- assertNotVisible:
    id: 'barra-de-pestanas'
- assertNotVisible:
    id: 'cabecera'
- assertNotVisible:
    id: 'boton-atras'
- assertNotVisible:
    id: 'saltar'
- assertNotVisible:
    id: 'control-de-zoom'
# Y el mapa no está: al parar, el mapa no se pinta.
- assertNotVisible:
    id: 'mapa-lamina'

# ── Ninguna cifra ──────────────────────────────────────────────────────────────
# Ni de distancia, ni de tiempo, ni de ritmo, ni de progreso, ni de reputación.
- assertNotVisible:
    id: 'kilometros'
- assertNotVisible:
    id: 'porcentaje-de-aventura'
- assertNotVisible: '.*\d+\s*%.*'
- assertNotVisible: '.*\d+\s*(km|kcal|min|minutos)\b.*'

# ── «Seguir» es la única acción, y cierra la llegada ───────────────────────────
# El móvil vuelve al bolsillo: debajo está el momento en marcha, no una pantalla anterior.
- assertVisible:
    id: 'llegada-seguir'
- tapOn:
    id: 'llegada-seguir'
- extendedWaitUntil:
    visible:
      id: 'en-marcha'
    timeout: 30000
- assertVisible:
    id: 'mapa-lamina'
- assertNotVisible:
    id: 'lo-que-se-cuenta'

# ── Pararse en el mismo sitio no tiene consecuencias ───────────────────────────
# Se sigue parada donde estaba y la llegada ya está cerrada: no se vuelve a ofrecer en la
# misma salida, y nada se enciende por seguir pisándola.
- assertNotVisible:
    id: 'llegada'
- assertNotVisible:
    id: 'notificacion'
