# @app — La llegada dentro del móvil (SPEC-032).
#
# Aquí vive **solo lo que necesita dispositivo**, que en esta fila es muy poco y está muy
# bien delimitado: que validar una llegada **no encienda la pantalla ni ponga la app en
# primer plano**, y que la escena siga esperando cuando alguien se digna a mirar. Todo lo
# demás —el radio, la permanencia, la regla de la duda, el orden de la secuencia, el visor
# a un toque, lo que aquí se cuenta al final, el diario, la ausencia de navegación y la
# ausencia de consulta sin haber llegado— se afirma en `test/nucleo/llegadas.test.mjs`, que
# corre sin simulador. Duplicarlo aquí solo añadiría un flujo lento que se cae por el
# entorno: **la secuencia es un dato del núcleo justamente para que no haga falta un
# simulador para ponerla roja.**
#
# **NO SE EJECUTA EN LA MÁQUINA DE ESTE PIPELINE.** No hay Xcode completo ni SDK de
# Android, así que ningún flujo `@app` se puede correr aquí
# (`pipeline/decisiones-orquestador.md` §4). El flujo se escribe igual y el runner lo
# registra como infraestructura ausente, nunca como verde.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Una puerta hasta la pantalla.** `app/pantallas/llegada.js` y
#   `app/pantallas/lo-que-se-cuenta.js` existen y están enteras, pero **`App.js` no las
#   monta**: no hay ningún camino que lleve a la llegada en un dispositivo. El primer paso
#   de abajo va contra `paso-llegada`, que es el nombre que le corresponde por la
#   convención de los otros pasos provisionales (`paso-mapa`, `paso-marcha`,
#   `paso-revision-render`) y que **todavía no existe**. Es un hueco de cableado y no de
#   este flujo.
# - **Las pantallas de las filas 33 y 34.** El visor, la escena y la ficha no están en
#   disco: mientras no existan, `PantallaLlegada` monta el hueco con el paso nombrado, y
#   por eso lo que aquí se afirma es `llegada-paso` y no el contenido de cada pantalla.
# - **Un seguidor de posición cableado**, el mismo que le falta al momento en marcha: sin
#   él las posiciones de `setLocation` no llegan a la capa de llegadas.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que la pantalla no se encienda estando el móvil bloqueado en el bolsillo.** Maestro
#   no ve el estado de la pantalla del sistema. Lo que sí se comprueba es la mitad
#   automatizable: que la app no pasa a primer plano sola —se queda en el paso desde el que
#   se salió— y que no aparece ninguna notificación.
# - **Que el háptico no vibre.** El simulador no vibra; es `@manual` y está en
#   `docs/testing.md`.
#
# Los elementos se localizan por los identificadores que declara la spec —`momento-estado`,
# `llegada-secuencia`, `llegada-paso`, `lo-que-se-cuenta`, `lo-que-se-cuenta-de-ti`,
# `llegada-seguir`, `visor-a-un-toque`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «La escena queda disponible y espera»
#   «Pararse en un semáforo dentro de un geofence no tiene consecuencias»
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# El paso a la llegada, provisional como el del mapa y el de en marcha. Hoy no existe.
- tapOn:
    id: 'paso-llegada'

# ── Se llega andando y se para dentro del geofence ─────────────────────────────
# El sitio es el núcleo del mundo de andamiaje. Se entra andando y se para dentro: la
# permanencia se cumple con dos fijos separados en el tiempo, no con una espera del flujo.
- setLocation:
    latitude: 42.4012
    longitude: -8.8114
- setLocation:
    latitude: 42.4010
    longitude: -8.8110

# ── La escena queda disponible y espera ────────────────────────────────────────
# Nadie mira el móvil: la app no se ha puesto en primer plano sola y no ha aparecido
# ninguna notificación. El momento sigue siendo el de andar.
- assertNotVisible:
    id: 'notificacion'
- assertNotVisible:
    id: 'lo-que-se-cuenta'
- assertVisible:
    id: 'momento-estado'
- assertVisible: 'en-marcha'

# Si el jugador mira, la escena está ahí. Esto es «abrir la app», no un control del juego.
- launchApp
- assertVisible:
    id: 'llegada'
- assertVisible:
    id: 'momento-estado'
- assertVisible: 'al-parar'

# La secuencia ofrecida, expuesta como la lista ordenada de tipos y modos: se afirma el
# orden entero sin recorrer cuatro pantallas.
- assertVisible:
    id: 'llegada-secuencia'
- assertVisible: 'lo-que-se-cuenta:encadenado'
- assertVisible:
    id: 'llegada-paso'

# ── Ninguna de estas pantallas se navega ───────────────────────────────────────
# No hay barra, no hay flecha de atrás entre pasos y no hay manera de saltar al siguiente.
- assertNotVisible:
    id: 'barra-de-pestanas'
- assertNotVisible:
    id: 'cabecera'
- assertNotVisible:
    id: 'boton-atras'
- assertNotVisible:
    id: 'saltar'

# ── A4P5 · Lo que aquí se cuenta ───────────────────────────────────────────────
# El último paso encadenado de una llegada a un núcleo. Sin nada que se cuente de la
# jugadora, la sección «Y de ti» no existe —no se enseña vacía—.
- assertVisible:
    id: 'lo-que-se-cuenta'
- assertNotVisible:
    id: 'lo-que-se-cuenta-de-ti'
- assertVisible: 'Queda anotado en tu diario, con el sitio y el momento.'

# «Seguir» es la única acción, y cierra la llegada: el móvil vuelve al bolsillo.
- tapOn:
    id: 'llegada-seguir'
- assertNotVisible:
    id: 'lo-que-se-cuenta'

# ── Pararse en un semáforo dentro de un geofence no tiene consecuencias ────────
# Se vuelve a pasar por el mismo sitio dentro de la misma salida: la llegada ya está
# cerrada y no se vuelve a ofrecer, y nada se enciende por volver a pisarlo.
- setLocation:
    latitude: 42.4010
    longitude: -8.8110
- assertNotVisible:
    id: 'lo-que-se-cuenta'
- assertNotVisible:
    id: 'notificacion'
