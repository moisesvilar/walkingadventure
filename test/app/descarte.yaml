# @app — El sitio que no pega dentro del móvil (SPEC-035).
#
# Aquí vive **solo lo que necesita dedo**: que el gesto sean **dos toques y ninguno más**
# —que detrás de «Marcarlo» no aparezca ningún diálogo de confirmación—, que elegir un
# motivo y cerrar la capa sin marcar **no marque nada**, y que deshacer desde los ajustes
# devuelva el sitio. Todo lo demás —qué sale del casting, que el documento de la celda no
# cambie ni un byte, el vocabulario cerrado de motivos, la alarma de estirón y la
# atribución de la falta de reparto— se afirma en `test/nucleo/descartes.test.mjs`, que
# corre sin simulador. **La decisión vive en el paquete justamente para que no haga falta
# un simulador para ponerla roja**, y duplicarla aquí solo añadiría un flujo lento.
#
# **NO SE EJECUTA EN LA MÁQUINA DE ESTE PIPELINE.** No hay Xcode completo ni SDK de
# Android, así que ningún flujo `@app` se puede correr aquí
# (`pipeline/decisiones-orquestador.md` §4). El flujo se escribe igual y el runner lo
# registra como infraestructura ausente, nunca como verde.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Una puerta hasta la ficha.** `app/pantallas/llegada.js` monta la capa `descarte-anclaje`
#   sobre `PantallaFicha`, pero **`App.js` no monta la llegada**: el primer paso va contra
#   `paso-llegada`, que sigue el nombre de los otros pasos provisionales (`paso-mapa`,
#   `paso-marcha`, `paso-revision-render`) y **todavía no existe**. Es el mismo hueco de
#   cableado que declaran `test/app/llegada.yaml` y `test/app/visor.yaml`, y no es de aquí.
# - **La acción «Este sitio no pega» de A4P7**, que es de la fila 33 y es de donde cuelga
#   el primer toque. Se localiza por su texto porque la spec no le da identificador.
# - **La pantalla de ajustes A6P6**, que es de la fila 38: de aquí solo sale lo que cuelga
#   dentro (`sitios-marcados` y `sitio-marcado-deshacer`). El paso `paso-ajustes` tampoco
#   existe todavía.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que no salga tráfico al marcar.** Es `@privacidad` y bloqueante, y se afirma con el
#   inspector de red en modo estricto en `test/nucleo/descartes.test.mjs`: un flujo de
#   Maestro no ve la frontera de red del proceso.
# - **Que el documento de la celda no cambie ni un byte.** No hay manera de leer el
#   almacén desde Maestro; va en el núcleo.
#
# Los elementos se localizan por los identificadores que declara la spec
# —`descarte-anclaje`, `descarte-motivo`, `descarte-confirmar`, `sitios-marcados`,
# `sitio-marcado-deshacer`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Marcarlo lo saca del casting sin resembrar»  (la mitad del gesto)
#   «Es reversible»                               (la mitad del deshacer)
#   «No hace falta dar motivo»                    (el segundo toque sin elegir nada)
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# El paso a la llegada, provisional como el del mapa y el de en marcha. Hoy no existe.
- tapOn:
    id: 'paso-llegada'

# ── La ficha, y desde ella la acción discreta de la fila 33 ────────────────────
- assertVisible:
    id: 'ficha-texto'
- tapOn: 'Este sitio no pega'

# ── A4P8: la capa, con los cinco motivos y ninguno marcado ─────────────────────
- assertVisible:
    id: 'descarte-anclaje'
- assertVisible: '¿Qué le pasa a este sitio?'
# La línea que quita la obligación está, y está **antes** de los motivos: es lo que
# convierte la lista en una ayuda en lugar de en un formulario.
- assertVisible: 'No hace falta que digas por qué. Con marcarlo, el juego deja de mandarte aquí.'
- assertVisible: 'Se puede deshacer cuando quieras.'
- assertVisible: 'Es una casa particular'
- assertVisible: 'Otra cosa'

# ── Cerrar sin marcar habiendo elegido un motivo no marca nada ─────────────────
- tapOn:
    id: 'descarte-motivo'
    text: 'casa-particular'
- back
- assertVisible:
    id: 'ficha-texto'
- assertNotVisible:
    id: 'descarte-anclaje'

# ── El gesto entero: dos toques y ninguno más ─────────────────────────────────
# Primer toque: la acción de la ficha. Segundo y último: «Marcarlo». No se elige motivo
# a propósito —«No hace falta dar motivo»— y detrás no puede aparecer ningún diálogo.
- tapOn: 'Este sitio no pega'
- tapOn:
    id: 'descarte-confirmar'
- assertNotVisible:
    id: 'descarte-anclaje'
# La capa se cierra y se vuelve a la ficha. Ni línea de gracias, ni confirmación: que la
# acción ya no esté disponible es toda la confirmación que hace falta.
- assertVisible:
    id: 'ficha-texto'
- assertNotVisible: 'Este sitio no pega'

# ── Deshacer vive en ajustes y no en el sitio ─────────────────────────────────
- tapOn:
    id: 'paso-ajustes'
- assertVisible:
    id: 'sitios-marcados'
    text: '1'
- tapOn:
    id: 'sitios-marcados'
- assertVisible: 'Que vuelva a contar'
- tapOn:
    id: 'sitio-marcado-deshacer'
- assertVisible: 'Todavía no has marcado ninguno.'
- assertVisible:
    id: 'sitios-marcados'
    text: '0'
