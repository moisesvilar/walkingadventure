# @app — El sitio que no pega dentro del móvil (SPEC-035).
#
# @limite-declarado
#
# Este flujo **no recorre su pantalla**, y ya no por la capa de llegadas: el motivo está
# medido y escrito abajo. Lo único que llega a ejecutarse es la
# guarda de más abajo, así que su verde significa «el límite sigue en pie» y nunca «la
# pantalla funciona», y por eso no se cuenta en la misma casilla que un verde de
# verdad. El porqué entero y lo que haría falta para levantarlo están en «LÍMITE
# DECLARADO», unas líneas más abajo.
#
# La lista de flujos marcados está fijada en `test/nucleo/limite-declarado.test.mjs`:
# poner o quitar este marcador sin tocar aquella lista pone la suite en rojo, que es
# lo que convierte marcar y desmarcar en un acto deliberado y visible.
#
# Aquí vive **solo lo que necesita dedo**: que el gesto sean **dos toques y ninguno más**
# —que detrás de «Marcarlo» no aparezca ningún diálogo de confirmación—, que elegir un
# motivo y cerrar la capa sin marcar **no marque nada**, y que deshacer desde los ajustes
# devuelva el sitio. Todo lo demás —qué sale del casting, que el documento de la celda no
# cambie ni un byte, el vocabulario cerrado de motivos, la alarma de estirón y la
# atribución de la falta de reparto— se afirma en `test/nucleo/descartes.test.mjs`, que
# corre sin simulador. **La decisión vive en el paquete justamente para que no haga falta
# un simulador para ponerla roja**, y duplicarla aquí solo añadiría un flujo lento.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Una llegada a un paraje**, que es la única que trae ficha. La que un flujo alcanza sin
#   coordenadas es la del sitio por el que empieza el mapa, y es un núcleo. Medido abajo.
# - **La acción «Este sitio no pega» de A4P7**, que es de la fila 33 y es de donde cuelga
#   el primer toque. Se localiza por su texto porque la spec no le da identificador.
# - **La lista de sitios marcados dentro de A6P6.** La puerta de los ajustes ya existe y es
#   `puerta-ajustes`, la del pie de la portada (§6y), y desde la fila 44 la fila «Sitios que
#   marcaste» lleva a la lista y a deshacer. Lo que falta para recorrerlo es haber marcado
#   algo, y para eso hace falta la llegada.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que no salga tráfico al marcar.** Es `@privacidad` y bloqueante, y se afirma con el
#   inspector de red en modo estricto en `test/nucleo/descartes.test.mjs`: un flujo de
#   Maestro no ve la frontera de red del proceso.
# - **Que el documento de la celda no cambie ni un byte.** No hay manera de leer el
#   almacén desde Maestro; va en el núcleo.
#
# Los elementos se localizan por los identificadores que declara la spec
# —`descarte-anclaje`, `descarte-motivo`, `descarte-confirmar`, `sitios-marcados`,
# `sitio-marcado-deshacer`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Marcarlo lo saca del casting sin resembrar»  (la mitad del gesto)
#   «Es reversible»                               (la mitad del deshacer)
#   «No hace falta dar motivo»                    (el segundo toque sin elegir nada)
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# ── LÍMITE DECLARADO ───────────────────────────────────────────────────────────
#
# **Lo que impide recorrerla, medido en `wa-pixel` el 12-ago-2026.** El motivo que había aquí
# —que la capa de llegadas no se montaba en el dispositivo— **ya no es cierto y se corrige en
# lugar de arrastrarlo**: la capa monta y `test/app/llegada.yaml` recorre su pantalla de
# verdad. Lo que falta ahora es otra cosa, y es de dónde cuelga el primer toque:
#
# - **La capa de A4P8 cuelga de la ficha, y la ficha solo la trae un paraje al que no se ha
#   venido a nada.** La única llegada que un flujo alcanza sin coordenadas es la del sitio
#   por el que empieza el mapa, que es un **núcleo**: su secuencia es el paso encadenado de
#   lo que allí se cuenta y no lleva ficha, así que no hay ningún «Este sitio no pega» que
#   tocar. Medido: en la llegada validada, `llegada-secuencia` trae
#   `lo-que-se-cuenta:encadenado` y nada más.
# - **Y andar hasta un paraje no se puede escribir.** Haría falta su coordenada, y el ancla
#   del mapa **no es reproducible entre ejecuciones**: tres tandas seguidas, con la misma
#   posición puesta antes del arranque, dieron `42.40,-8.77`, `42.40,-8.75` y `42.40,-8.76`.
#   Un destino escrito a mano se caería por dónde estaba el emulador y no por lo que mide.
#
# Mientras eso sea así, este flujo **no recorre nada y lo dice**: su verde significa «el
# límite sigue en pie», nunca «el descarte funciona». Lo que sí está vivo y sin dispositivo
# es todo lo demás —lo saca del casting sin resembrar, es reversible, no hace falta motivo y
# no se reporta a ningún sitio—, en `test/nucleo/descartes.test.mjs`.
- runFlow:
    when:
      notVisible:
        id: 'llegada'
    commands:
      - assertVisible:
          id: 'arranque'
      - assertNotVisible:
          id: 'llegada'

# El flujo de verdad, a la espera de su puerta.
- runFlow:
    when:
      visible:
        id: 'llegada'
    commands:
      # ── Se llega andando y se para dentro del geofence ─────────────────────────────
      # La escena no se navega: se llega. Cuando la capa se monte, este cuerpo entra por
      # donde entra una persona y la condición de arriba se cumple sola.
      # ── La ficha, y desde ella la acción discreta de la fila 33 ────────────────────
      - assertVisible:
          id: 'ficha-texto'
      - tapOn: 'Este sitio no pega'

      # ── A4P8: la capa, con los cinco motivos y ninguno marcado ─────────────────────
      - assertVisible:
          id: 'descarte-anclaje'
      - assertVisible: '¿Qué le pasa a este sitio?'
      # La línea que quita la obligación está, y está **antes** de los motivos: es lo que
      # convierte la lista en una ayuda en lugar de en un formulario.
      - assertVisible: 'No hace falta que digas por qué. Con marcarlo, el juego deja de mandarte aquí.'
      - assertVisible: 'Se puede deshacer cuando quieras.'
      - assertVisible: 'Es una casa particular'
      - assertVisible: 'Otra cosa'

      # ── Cerrar sin marcar habiendo elegido un motivo no marca nada ─────────────────
      - tapOn:
          id: 'descarte-motivo'
          text: 'casa-particular'
      - back
      - assertVisible:
          id: 'ficha-texto'
      - assertNotVisible:
          id: 'descarte-anclaje'

      # ── El gesto entero: dos toques y ninguno más ─────────────────────────────────
      # Primer toque: la acción de la ficha. Segundo y último: «Marcarlo». No se elige motivo
      # a propósito —«No hace falta dar motivo»— y detrás no puede aparecer ningún diálogo.
      - tapOn: 'Este sitio no pega'
      - tapOn:
          id: 'descarte-confirmar'
      - assertNotVisible:
          id: 'descarte-anclaje'
      # La capa se cierra y se vuelve a la ficha. Ni línea de gracias, ni confirmación: que la
      # acción ya no esté disponible es toda la confirmación que hace falta.
      - assertVisible:
          id: 'ficha-texto'
      - assertNotVisible: 'Este sitio no pega'

      # ── Deshacer vive en ajustes y no en el sitio ─────────────────────────────────
      - tapOn:
          id: 'puerta-ajustes'
      - assertVisible:
          id: 'sitios-marcados'
          text: '1'
      - tapOn:
          id: 'sitios-marcados'
      - assertVisible: 'Que vuelva a contar'
      - tapOn:
          id: 'sitio-marcado-deshacer'
      - assertVisible: 'Todavía no has marcado ninguno.'
      - assertVisible:
          id: 'sitios-marcados'
          text: '0'
