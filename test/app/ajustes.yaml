# @app — Los ajustes dentro del móvil (SPEC-038).
#
# **Recorre su pantalla desde el 10-ago-2026.** Hasta la fila 43 este flujo llevaba
# `@limite-declarado`: no había ninguna puerta hasta A6P6 y lo único que ejecutaba era
# una guarda que comprobaba que la pantalla seguía sin existir. Ahora `App.js` monta el
# momento de consulta y la puerta es la del pie de la portada, así que **este flujo entra
# por donde entra una persona** y su verde vale lo que dice.
#
# Se llega recorriendo el arranque entero, que es el único camino a la portada, y por eso
# empieza reutilizando `arranque.yaml` en vez de copiarlo.
#
# Aquí vive **solo lo que necesita dispositivo**. El catálogo cerrado, los cinco grupos y
# su orden, los tres tipos de fila, el valor derivado de cada una, que no exista una fila
# del oficio y que una fila sin dueño cableado impida componer la pantalla son
# afirmaciones sobre **datos** y se comprueban en `test/nucleo/ajustes.test.mjs` sin
# simulador. Lo que no se puede ver sin dispositivo es:
#
# 1. **Que la voz de aplicación se note hasta en la tipografía**, y que la frontera se
#    cruce al entrar y al salir: en los ajustes se lee en sans y en la repisa en serif,
#    sin que ninguna de las dos pantallas elija su fuente.
# 2. **Que el interruptor de los pasos del día a día no se encienda solo por tocarlo**: lo
#    que hace es pedirlo, y el valor que se pinta es siempre el real. El dato dice cuál es
#    el real; que el conmutador no se adelante solo se ve tocándolo.
# 3. **Que «Empezar de nuevo» no lleve color destructivo en la lista** y sí en su pantalla.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesitaba y ya tiene**, todo de la fila 43:
#
# - **La puerta hasta la pantalla**, que es `puerta-ajustes` al pie de la portada. El paso
#   provisional `paso-ajustes` nunca llegó a existir y ya no hará falta.
# - **Las dueñas de las filas cableadas.** `ConsultaMontada` arma el contexto de
#   `componeAjustes` desde el estado de la partida: el tramo y el género del personaje, el
#   estilo y el tamaño de letra del área de pintado, los sitios marcados del área de
#   anclajes y las dos puertas declaradas. Una fila sin su pieza sigue impidiendo componer
#   la pantalla, y entonces sale `consulta-sin-cablear` con la pieza nombrada.
# - **La pantalla de «Empezar de nuevo»** (fila 40), que cuelga de la última fila de esta.
#
# **Lo que sigue sin poder afirmarse aquí, y por qué:** los caminos que evitar valen
# siempre «ninguno», porque **ninguna área del estado los guarda todavía**. No es un valor
# por defecto tragado: `ConsultaMontada` los recibe por la firma y quien los persista los
# pasará sin tocar nada más.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que la sans sea la sans.** Maestro no compara tipografías. Lo que sí se puede
#   afirmar es el registro que declara cada pantalla —`ajustes-registro` vale `aplicacion`
#   aquí y la repisa declara `mundo`—, que es de donde sale la fuente.
# - **Que los títulos de grupo vayan en versalitas del color del filete.** Tampoco se ven
#   colores ni espaciados desde aquí.
#
# Los elementos se localizan por los identificadores que declara la spec —`momento`,
# `ajustes-lista`, `ajustes-grupo`, `ajustes-fila`, `ajustes-como-se-pinta`,
# `ajustes-pasos-de-fondo`, `ajustes-nombre`, `ajustes-genero`, `ajustes-registro`— y
# nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Los ajustes son la única excepción»
#   «El oficio no aparece en ajustes»
#   «Los pasos de fondo vienen apagados»
#
appId: com.walkingadventure.app
---
# A la portada se llega saliendo del arranque, que hoy es el único camino. El flujo del
# arranque ya está escrito y se reutiliza entero en vez de copiarlo.
- runFlow:
    file: arranque.yaml

- tapOn:
    id: 'puerta-ajustes'

# ── Los ajustes son la única excepción ─────────────────────────────────────────
# La pantalla declara su registro, y es el único sitio del juego donde vale `aplicacion`.

- assertVisible:
    id: 'momento'
- assertVisible: 'de-consulta'
- assertVisible:
    id: 'ajustes-registro'
- assertVisible: 'aplicacion'
- assertVisible: 'Ajustes'

# Los cinco grupos, en su orden, y las once filas colgando de ellos.
- assertVisible:
    id: 'ajustes-lista'
- assertVisible: 'como-andas,tu-personaje,el-mapa,el-mundo,tus-cosas'
- assertVisible:
    id: 'ajustes-grupo'
- assertVisible:
    id: 'ajustes-fila'
- assertVisible: 'Cómo se pinta'
- assertVisible: 'Tamaño de la letra'
- assertVisible: 'Solo de día'
- assertVisible: 'Guardar una copia'
- assertVisible: 'Empezar de nuevo'

# ── El oficio no aparece en ajustes ────────────────────────────────────────────
# Se puede cambiar el nombre y el género gramatical, y no el oficio.

- assertVisible:
    id: 'ajustes-nombre'
- assertVisible: 'Cómo te llamas'
- assertVisible:
    id: 'ajustes-genero'
- assertVisible: 'Cómo se dirigen a ti'

- assertNotVisible: 'Oficio'
- assertNotVisible: 'A qué te dedicas'
- assertNotVisible: 'Cambiar de oficio'
- assertNotVisible:
    id: 'ajustes-oficio'

# Ni ninguna fila que cambie el mapa activo, ni nada de red, cuenta, suscripción o
# analítica: el catálogo es cerrado y estas no están.
- assertNotVisible: 'Mapa activo'
- assertNotVisible: 'Cambiar de mapa'
- assertNotVisible: 'Cuenta'
- assertNotVisible: 'Suscripción'
- assertNotVisible: 'Iniciar sesión'
- assertNotVisible: 'Datos de uso'

# Ni la palabra que «caminos que evitar» no dice nunca.
- assertVisible: 'Caminos que evitar'
- assertNotVisible: 'Accesibilidad'
- assertNotVisible: 'Modo'
- assertNotVisible: 'Adaptado'

# ── Los pasos de fondo vienen apagados ─────────────────────────────────────────
# Instalación nueva: apagado. Y tocarlo **no lo enciende**: lo pide. Hasta que el permiso
# no vuelve concedido, lo que se pinta sigue siendo el valor real.

- assertVisible:
    id: 'ajustes-pasos-de-fondo'
- assertVisible: 'Contar los pasos del día a día'
- tapOn:
    id: 'ajustes-pasos-de-fondo'
- assertVisible:
    id: 'ajustes-pasos-de-fondo'
# Aquí había `assertVisible: 'no'` y estaba mal escrito desde el principio: **una fila de
# interruptor no pinta su valor**. `ajustes.jsx` dibuja un `Switch` para `tipo:
# 'interruptor'` y reserva el `Text` del valor para las filas de valor y las puertas, que
# es exactamente lo que el artefacto pide —un interruptor enseña su estado con su forma, no
# con una palabra al lado—. La palabra «no» que la composición deriva en `valorDeFila` es
# dato para `@nucleo`, y allí se afirma. Medido en `wa-pixel`: el texto no está en el árbol
# de accesibilidad y el `assertVisible` no puede pasar en ninguna máquina.
#
# Lo que sí se puede afirmar, y es lo que el criterio quería decir, es **el estado del
# interruptor**: apagado de origen y apagado después de tocarlo, porque tocarlo lo pide y
# no lo enciende.
- assertVisible:
    id: 'ajustes-pasos-de-fondo'
    checked: false

# ── Lo destructivo no se marca en la lista ─────────────────────────────────────
# «Empezar de nuevo» es la última y aquí es una puerta más; el aviso vive en su pantalla.

- assertNotVisible: '.*Se pierde todo esto.*'
- assertNotVisible: '.*no se puede deshacer.*'
- tapOn: 'Empezar de nuevo'
# Dos correcciones aquí, las dos por lo mismo: **este flujo nunca se había ejecutado**.
#
# 1. Decía `'Se borrará'`, que **no existe en ningún sitio del repositorio**. La frase la
#    compone `fraseDeLaPerdida` y empieza por «Se pierde todo esto»; `empezar-de-nuevo.yaml`
#    ya afirmaba la buena, así que las dos pruebas se contradecían entre ellas.
# 2. Va con comodines. **Maestro casa el texto entero de un nodo, no una subcadena** —por
#    eso el resto del repositorio escribe `'.*…​.*'` cuando quiere un trozo—, y lo que aquí
#    se busca es el principio de un párrafo que sigue con el nombre, los mapas y el cierre.
#    Sin comodines la afirmación no puede pasar en ninguna máquina.
- assertVisible: '.*Se pierde todo esto.*'

# ── La frontera se cruza al salir ──────────────────────────────────────────────
# Fuera de los ajustes ya no se habla como aplicación: la repisa declara `mundo`.

- back
- tapOn: '‹ Volver'
- tapOn:
    id: 'puerta-repisa'
- assertVisible: 'La repisa'
- assertNotVisible:
    id: 'ajustes-registro'
