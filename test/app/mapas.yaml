# @app — Una partida, muchos mapas, y ningún selector, dentro del móvil (SPEC-041).
#
# @limite-declarado
#
# Este flujo **no recorre su pantalla**, y desde SPEC-047 el motivo es otro. Lo único que
# llega a ejecutarse es la guarda de más abajo, así que su verde significa «el límite sigue
# en pie» y nunca «la pantalla funciona», y por eso no se cuenta en la misma casilla que un
# verde de verdad. El porqué entero está en «LÍMITE DECLARADO», unas líneas más abajo.
#
# **Corrección de este fichero, 10-ago-2026, con la medida delante.** Decía que a la portada
# solo se llega con una partida levantada y que la app abre en el arranque. La segunda mitad
# **es falsa desde SPEC-047**: la partida se guarda, y al abrir la app con una partida en
# disco se abre en la portada. Medido: con `clearState: false` y la partida que dejó
# `partida-persistida.yaml`, este flujo salía por la rama de la guarda y afirmaba `arranque`
# visible, que ya no lo está — `EXIT=1`, «Assert that id: arranque is visible... FAILED».
# No es la caída de `adb`: se reprodujo tres veces seguidas y la tercera llegó a la
# aserción.
#
# El arreglo es de este fichero y no del código, porque **lo que le falta a este flujo no
# era nunca la puerta**: son dos mapas montados y el ofrecimiento cableado, y eso sigue sin
# estar. Lo que se corrige es de qué depende su entrada: pasa a `clearState: true`, que la
# hace determinista y no dependiente de lo que dejara el flujo anterior. El día que exista
# la manera de sembrar una partida de dos mapas en el dispositivo, quien la monte devuelve
# el `clearState: false` con el paso de siembra delante.
#
# La lista de flujos marcados está fijada en `test/nucleo/limite-declarado.test.mjs`:
# poner o quitar este marcador sin tocar aquella lista pone la suite en rojo, que es
# lo que convierte marcar y desmarcar en un acto deliberado y visible.
#
# Aquí vive **solo lo que necesita dispositivo**. Casi toda esta fila es dato y se pone
# roja sin simulador: la resolución del mapa activo, el alcance en tramos, el desempate,
# la ausencia de una operación que fije el mapa a mano, la unicidad de nombres entre
# celdas, la identidad byte a byte de una celda con y sin vecinas, el contador por mapa y
# que el rango no viaje están en `test/nucleo/mapas.test.mjs`,
# `test/nucleo/repertorio.test.mjs` y `test/nucleo/andar.test.mjs`. Es el reparto que
# eligió la spec —«casi todo es afirmable en @nucleo»— y por eso este flujo es corto. Lo
# que no se puede ver sin dispositivo es:
#
# 1. **Que el ofrecimiento sustituya a la portada y no se superponga a ella**: no hay
#    mapa dibujado detrás, ni portada, ni salir a andar. Una sustitución solo se
#    distingue de una superposición mirando la pantalla entera.
# 2. **Que no haya ninguna manera de cambiar el mapa activo a mano**, que es el escenario
#    entero de «No existe ningún selector de mapas»: recorrer las pantallas y no
#    encontrar ni selector, ni lista de mapas, ni miga de pan con el nombre del mapa.
# 3. **Que volver a un sitio conocido no se anuncie**: ni transición, ni aviso, ni
#    bienvenida. Es una ausencia en el momento del cambio, y solo se ve viviéndolo.
# 4. **Que abrir una celda vecina en marcha no enseñe nada**: la regla de que en marcha
#    no hay nada que tocar no tiene excepciones, y comprobarlo exige el momento en marcha
#    de verdad, con el GPS cruzando un borde.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Una partida con dos mapas montada en el simulador**, uno de casa y otro lejos: el
#   mapa activo lo decide la posición, así que sin dos mapas no hay nada que decidir. El
#   andamiaje tiene que dejarla puesta antes de `launchApp`.
# - **El cableado del ofrecimiento en `App.js`.** `app/pantallas/ofrecimiento.jsx` existe
#   y `PantallaAntesDeSalir` ya lo acepta, pero quien resuelve el mapa activo al abrir y
#   decide entre portada y ofrecimiento es la app, y eso no está montado todavía.
# - **El proxy alcanzable desde el simulador** (`EXPO_PUBLIC_PROXY`) para el camino de
#   levantar el mapa nuevo. El camino de rechazarlo no lo necesita, y es el que se
#   recorre aquí primero a propósito.
# - **Un nodo en `docs/flujo.md`** para el ofrecimiento, que la spec deja anotado como
#   hueco: `scripts/verifica-flujo.mjs` compara el diagrama con las pantallas dibujadas y
#   esta no lo está.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que el mapa que se pinta sea el del sitio donde estás**, más allá de su
#   identificador: comparar láminas no es de Maestro. El identificador cuelga de
#   `mapa-activo`, que es exactamente por lo que la spec lo declara como el localizador
#   del que cuelga todo lo demás.
# - **Que la serif sea la serif** del ofrecimiento. El registro que declara la pantalla ya
#   está afirmado en `@nucleo`, donde además no se desactualiza.
#
# Los elementos se localizan por los identificadores que declara la spec —`momento`,
# `mapa-activo`, `ofrecer-levantar-mapa`, `levantar-mapa-aqui`, `dejarlo-estar`,
# `celda-apertura`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «El mapa activo lo decide dónde estás»
#   «Llegar a un sitio nuevo ofrece levantar un mapa»
#   «No existe ningún selector de mapas»
#
appId: com.walkingadventure.app
---
# Instalación limpia, y es deliberado: sin ella la entrada de este flujo depende de la
# partida que dejara el flujo anterior, y eso no es una guarda sino una lotería.
- launchApp:
    clearState: true

# ── El mapa activo lo decide dónde estás ──────────────────────────────────────
# Se abre la app estando en casa: sale la portada del mapa de casa, sin preguntar nada.

# ── LÍMITE DECLARADO ───────────────────────────────────────────────────────────
#
# Lo que falta **no es la puerta**: son los dos mapas. El mapa activo lo decide dónde
# estás, así que con uno solo no hay nada que decidir y el ofrecimiento no puede aparecer;
# y quien resuelve el mapa activo al abrir —y decide entre portada y ofrecimiento— es
# `App.js`, que no lo monta. Sin ubicación (fila 48) tampoco hay posición con la que
# resolverlo, y sembrar una partida de dos mapas en el dispositivo no tiene hoy ninguna vía
# que no sea una puerta trasera.
#
# Desde una instalación limpia no hay partida, así que la app abre en el arranque y este
# flujo **no recorre nada y lo dice**. Su verde significa «el límite declarado sigue en
# pie», nunca «la pantalla está verificada». El día que haya dos mapas montados, la
# condición cambia sola y el cuerpo de abajo se ejecuta entero.
- runFlow:
    when:
      notVisible:
        id: 'portada'
    commands:
      - assertVisible:
          id: 'arranque'
      - assertNotVisible:
          id: 'portada'

# El flujo de verdad, a la espera de su camino.
- runFlow:
    when:
      visible:
        id: 'portada'
    commands:
      - setLocation:
          latitude: 42.402
          longitude: -8.809
      - assertVisible:
          id: 'portada'
      - assertVisible:
          id: 'momento'
      - assertVisible: 'antes-de-salir'
      - assertVisible:
          id: 'mapa-activo'
      - assertVisible: '42.40,-8.81'
      - assertNotVisible:
          id: 'ofrecer-levantar-mapa'

      # Nada ha preguntado: ni un diálogo, ni una lista, ni una bienvenida.
      - assertNotVisible: 'Elegir mapa'
      - assertNotVisible: 'Tus mapas'
      - assertNotVisible: 'Bienvenida'
      - assertNotVisible: 'Volver a casa'

      # ── No existe ningún selector de mapas ────────────────────────────────────────
      # Se recorren las pantallas del juego y en ninguna hay manera de cambiarlo a mano.

      - assertNotVisible:
          id: 'selector-de-mapas'
      - assertNotVisible:
          id: 'lista-de-mapas'
      - assertNotVisible:
          id: 'cambiar-mapa'

      - tapOn:
          id: 'puerta-ajustes'
      - assertNotVisible: 'Mapas'
      - assertNotVisible: 'Cambiar de mapa'
      - assertNotVisible:
          id: 'selector-de-mapas'
      - tapOn: '‹'

      # ── Llegar a un sitio nuevo ofrece levantar un mapa ───────────────────────────
      # El GPS salta a cuatrocientos kilómetros: no hay mapa activo, y el ofrecimiento
      # **sustituye** a la portada en lugar de superponerse. No hay mapa detrás.

      - setLocation:
          latitude: 40.4168
          longitude: -3.7038
      - assertVisible:
          id: 'ofrecer-levantar-mapa'
      - assertNotVisible:
          id: 'portada'
      - assertVisible:
          id: 'mapa-activo'
      - assertVisible: 'ninguno'

      - assertVisible: 'Hasta aquí no llega ninguno de tus mapas'
      - assertVisible: 'Si esto va a ser sitio tuyo, se puede levantar uno.'
      - assertVisible:
          id: 'levantar-mapa-aqui'
      - assertVisible:
          id: 'dejarlo-estar'

      # Las tres puertas siguen —el diario es donde se leen los mapas donde ya no estás— y
      # salir a andar no: no se juega donde no estás.
      - assertVisible:
          id: 'puerta-diario'
      - assertVisible:
          id: 'puerta-repisa'
      - assertVisible:
          id: 'puerta-ajustes'
      - assertNotVisible:
          id: 'salir-sin-mas'
      - assertNotVisible:
          id: 'ver-que-se-cuenta'

      # Y ninguna distancia, ninguna lista de mapas y ningún «volver a casa».
      - assertNotVisible: 'km'
      - assertNotVisible: 'Volver a casa'
      - assertNotVisible: 'Tus mapas'

      # Rechazar no se recuerda: se deja estar, y el mismo sitio vuelve a ofrecerlo igual.
      - tapOn:
          id: 'dejarlo-estar'
      - assertVisible:
          id: 'ofrecer-levantar-mapa'
      - assertNotVisible:
          id: 'salir-sin-mas'
      - launchApp:
          clearState: false
      - setLocation:
          latitude: 40.4168
          longitude: -3.7038
      - assertVisible:
          id: 'ofrecer-levantar-mapa'
      - assertVisible: 'Hasta aquí no llega ninguno de tus mapas'

      # ── Volver a casa no se anuncia ───────────────────────────────────────────────
      # Se vuelve al sitio de siempre: la portada de casa, sin transición ni mensaje.

      - setLocation:
          latitude: 42.402
          longitude: -8.809
      - assertVisible:
          id: 'portada'
      - assertVisible: '42.40,-8.81'
      - assertNotVisible: 'Bienvenida'
      - assertNotVisible: 'De vuelta'
      - assertNotVisible:
          id: 'ofrecer-levantar-mapa'

      # ── Abrir una celda vecina en marcha no enseña nada ───────────────────────────
      # Se sale a andar y el GPS cruza el borde de la celda. El mundo tiene que existir donde
      # estás, y eso es trabajo del juego: en marcha no hay nada que tocar y ninguna excepción.

      - tapOn:
          id: 'salir-sin-mas'
      - assertVisible:
          id: 'momento-en-marcha'
      - setLocation:
          latitude: 42.402
          longitude: -8.760
      - assertVisible:
          id: 'momento-en-marcha'
      - assertNotVisible:
          id: 'celda-apertura'
      - assertNotVisible: 'Levantando'
      - assertNotVisible: 'Dibujando el mundo'
      - assertNotVisible:
          id: 'control-tocable'
