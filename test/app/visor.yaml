# @app — El visor del anclaje dentro del móvil (SPEC-033).
#
# @limite-declarado
#
# Este flujo **no recorre su pantalla**: la capa de llegadas no llega a montarse en el
# dispositivo, así que no hay escena que ofrecer. Lo único que llega a ejecutarse es la
# guarda de más abajo, así que su verde significa «el límite sigue en pie» y nunca «la
# pantalla funciona», y por eso no se cuenta en la misma casilla que un verde de
# verdad. El porqué entero y lo que haría falta para levantarlo están en «LÍMITE
# DECLARADO», unas líneas más abajo.
#
# La lista de flujos marcados está fijada en `test/nucleo/limite-declarado.test.mjs`:
# poner o quitar este marcador sin tocar aquella lista pone la suite en rojo, que es
# lo que convierte marcar y desmarcar en un acto deliberado y visible.
#
# Aquí vive **solo lo que necesita dedo**: el arrastre del tirador de un lado al otro, que
# soltarlo antes del cruce vuelva a la ficción, que cerrar deje debajo lo que ya estaba, y
# que tocar fuera cierre igual que la flecha. Todo lo demás —qué presentación se elige, qué
# dice cada cartela, que sin foto el visor abra igual, que la segunda vez no se abra sola,
# la ficha entera y el vocabulario prohibido— se afirma en `test/nucleo/visor.test.mjs`,
# que corre sin simulador. **La decisión vive en el paquete justamente para que no haga
# falta un simulador para ponerla roja**, y duplicarla aquí solo añadiría un flujo lento.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Que la capa de llegadas se monte en el dispositivo**, que es el mismo límite que
#   declara `test/app/llegada.yaml` y no es de este flujo. Medido en «LÍMITE DECLARADO».
# - **Una ilustración residente en el almacén del mundo**, que es lo único que hace que la
#   presentación sea el visor y no la ficha. Hoy no hay lector de recursos binarios cableado
#   —`app/marcha/llegadas.js` lo declara con nombre y dueño en `SIN_RECURSOS` y
#   `LECTOR_SIN_RESIDENTES`—, así que **toda llegada se resuelve como ficha y el visor no se
#   abre nunca en el dispositivo**. O sea que este flujo tiene dos límites y no uno, y el
#   segundo sobrevive al primero: arreglar la capa no basta para que el visor aparezca.
# - **La pantalla de la escena (A4P3)**, que es de la fila 49: mientras no exista, cerrar
#   el visor deja debajo el hueco con el paso nombrado y por eso se afirma `llegada-paso`.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que la foto sea la del sitio real.** Maestro no compara imágenes; lo que sí se
#   comprueba es que el lado real está y qué nombre dice su cartela.
# - **Que el fondo liso sea el papel del estilo activo.** Es pintado, y va en la revisión
#   `@manual` de `docs/testing.md`.
#
# Los elementos se localizan por los identificadores que declara la spec —`llegada-estado`,
# `visor-anclaje`, `visor-lado-real`, `visor-cartela`, `visor-tirador`, `visor-cerrar`,
# `visor-abrir`, `ficha-texto`— y nunca por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Arrastrar descubre el sitio real»
#   «El visor es una capa y debajo está el beat»
#   «Sin foto de Places, el visor abre igual»
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# ── LÍMITE DECLARADO ───────────────────────────────────────────────────────────
#
# **Lo que impide recorrerla, medido en `wa-pixel` el 11-ago-2026 y no supuesto.** El párrafo
# que había aquí decía que faltaba `paso-llegada` en `app/App.js`; eso ya no es cierto y se
# corrige en lugar de arrastrarlo: SPEC-044 cableó la máquina y **no hay ningún paso
# provisional**, porque quien decide qué se ve es el estado —si hay una llegada validada sin
# cerrar, se monta su paso vigente— y no una puerta que se pueda tocar. Lo que falta ahora es
# otra cosa y está medida:
#
# - Se recorre el arranque entero, se echa a andar, se lleva la marca al centro exacto del
#   geofence de un sitio del mundo levantado y se está parada allí noventa segundos. La
#   cadencia **sí** cambia —la petición del sistema pasa a `@+5s0ms` y `FusedLocation`
#   registra `blocked - too fast` en vez de `too close`—, la traza **sí** dice `parada` en el
#   punto del sitio (`marca-posicion` = `del-mapa:-682,-340:parada`), y aun así **no valida
#   ninguna llegada**: el área congelada de la partida sigue con `llegadas.salida = null`,
#   que es lo que escribe montar la capa. Reproducido cuatro veces.
# - La misma celda, el mismo estado y la misma secuencia de posiciones, pasados por el mismo
#   código en Node, **validan a los treinta segundos**. Así que el paquete y
#   `app/marcha/llegadas.js` están bien: lo que falla es el cableado de `app/App.js`.
# - Una causa está localizada con su mensaje: por el camino de la partida recién nacida
#   —`App.js`, `partidaGuardada.nace(...).then(...)`— el mundo se guarda como
#   `{ mapaId, documento, titulo }` **sin `cupos`**, así que `creaLasLlegadas` recibe
#   `cupos: null` y muere con «la capa de descartes necesita el cupo que la celda congeló al
#   generarse (cupos.parajes.suelo) y llegó undefined». Es justo el camino que toma todo
#   flujo con `clearState: true`, y el de cualquier instalación nueva.
# - Y el fallo es **silencioso**: `montaLasLlegadas` lo recoge en `averia` y nadie enseña
#   `laSalida.averia()`, aunque su propio comentario diga «una capa que no se puede montar es
#   avería y se dice». Es §6h otra vez.
#
# **Va a `wa-dev` como defecto de código.** Mientras tanto este flujo se queda marcado: su
# verde significa «el límite sigue en pie», nunca «la pantalla funciona». El día que la capa
# se monte, este fichero hay que reescribirlo para que entre por donde entra una persona
# —arranque, portada, «Salir a andar», la marca dentro del geofence— y salga de la columna.
- runFlow:
    when:
      notVisible:
        id: 'llegada'
    commands:
      - assertVisible:
          id: 'arranque'
      - assertNotVisible:
          id: 'llegada'

# El flujo de verdad, a la espera de su puerta.
- runFlow:
    when:
      visible:
        id: 'llegada'
    commands:
      # ── Se llega andando y se para dentro del geofence ─────────────────────────────
      # La escena no se navega: se llega. Cuando la capa se monte, este cuerpo entra por
      # donde entra una persona y la condición de arriba se cumple sola.
      - setLocation:
          latitude: 42.4012
          longitude: -8.8114
      - setLocation:
          latitude: 42.4010
          longitude: -8.8110
      - launchApp

      # ── A4P1 · El visor abre por la ficción, y es una capa ─────────────────────────
      # El estado del momento sale del vocabulario cerrado del paquete. Sin foto de Places
      # —que es lo que hay hoy: ningún extracto trae un `place_id`— el estado es `visor-sin-foto`
      # y el visor **abre igual**.
      - assertVisible:
          id: 'llegada-estado'
      - assertVisible: 'visor-sin-foto'
      - assertVisible:
          id: 'visor-anclaje'
      - assertVisible:
          id: 'visor-cartela'
      - assertVisible: 'ficcion'
      - assertVisible: 'Arrastra para ver qué hay de verdad.'

      # La capa no añade ningún control de más: ni aceptar, ni confirmar, ni pasar de lámina.
      - assertNotVisible:
          id: 'boton-aceptar'
      - assertNotVisible:
          id: 'indicador-de-pagina'
      - assertNotVisible:
          id: 'barra-de-pestanas'

      # ── Un arrastre soltado antes del cruce vuelve a la ficción ────────────────────
      # Un cuarto del ancho: por debajo del punto de cruce, que está a la mitad. La cartela no
      # ha cambiado y el tirador ha vuelto al borde.
      #
      # El arrastre va por coordenadas y no anclado al tirador porque **Maestro no sabe ir de
      # un elemento a un punto**: `from:` admite `direction:`, nunca `to:`. Escrito como estaba
      # no compilaba —«Parsing Failed at visor.yaml:93:1»— y tumbaba el fichero entero. El
      # tirador nace en el borde de la ficción, que es el izquierdo, así que salir del 5% y
      # soltar en el 25% es el mismo gesto que se quería describir.
      - swipe:
          start: '5%, 50%'
          end: '25%, 50%'
      - assertVisible:
          id: 'visor-cartela'
      - assertVisible: 'ficcion'
      - assertVisible: 'Arrastra para ver qué hay de verdad.'

      # ── A4P2 · Arrastrar descubre el sitio real ────────────────────────────────────
      # Hasta el final: aparece el lado real y la cartela pasa a decir el nombre real. La línea
      # de invitación desaparece, porque ya se arrastró.
      - swipe:
          start: '5%, 50%'
          end: '95%, 50%'
      - assertVisible:
          id: 'visor-lado-real'
      - assertVisible: 'real'
      - assertVisible: 'Y en realidad'
      - assertNotVisible: 'Arrastra para ver qué hay de verdad.'
      # Sin foto de Places el lado real está igual y no se dibuja ningún hueco de imagen, ningún
      # icono de imagen rota y ninguna leyenda.
      - assertNotVisible:
          id: 'imagen-ausente'
      - assertNotVisible: 'no disponible'
      - assertNotVisible: 'sin conexión'

      # ── El visor es una capa y debajo está el beat ─────────────────────────────────
      # Cerrar con la flecha no lleva a ningún sitio: deja a la vista lo que ya estaba montado.
      - tapOn:
          id: 'visor-cerrar'
      - assertNotVisible:
          id: 'visor-anclaje'
      - assertVisible:
          id: 'llegada-paso'
      - assertVisible: 'beat'

      # ── La segunda vez queda a un toque, y vuelve a abrir por el borde ─────────────
      # Se cierra la llegada, se sale del geofence y se vuelve: el sitio ya está pisado, así que
      # el visor no abre solo y queda en una acción de texto con el nombre del sitio.
      - tapOn:
          id: 'llegada-seguir'
      - setLocation:
          latitude: 42.4100
          longitude: -8.8110
      - setLocation:
          latitude: 42.4010
          longitude: -8.8110
      - launchApp
      - assertNotVisible:
          id: 'visor-anclaje'
      - assertVisible:
          id: 'llegada-estado'
      - assertVisible: 'visor-a-un-toque'
      - assertVisible:
          id: 'visor-abrir'

      # Tocarla abre exactamente la capa de A4P1, con el tirador de vuelta en el borde de la
      # ficción: quien vuelve a mirar quiere volver a ver el cruce.
      - tapOn:
          id: 'visor-a-un-toque'
      - assertVisible:
          id: 'visor-anclaje'
      - assertVisible:
          id: 'visor-cartela'
      - assertVisible: 'ficcion'

      # ── Tocar fuera cierra igual que la flecha, y deja debajo lo mismo ─────────────
      - tapOn:
          id: 'visor-fuera'
      - assertNotVisible:
          id: 'visor-anclaje'
      - assertVisible:
          id: 'llegada-paso'

      # ── A4P7 · La ficha de texto, en un sitio sin ilustración ──────────────────────
      # El otro sitio del mundo de andamiaje no tiene ilustración: su llegada es la ficha, que es
      # pantalla y no capa, y no dice en ningún sitio que falte nada.
      - setLocation:
          latitude: 42.4030
          longitude: -8.8140
      - setLocation:
          latitude: 42.4031
          longitude: -8.8141
      - launchApp
      - assertVisible:
          id: 'llegada-estado'
      - assertVisible: 'ficha'
      - assertVisible:
          id: 'ficha-texto'
      - assertVisible: 'En realidad:'
      - assertNotVisible:
          id: 'visor-anclaje'
      - assertNotVisible:
          id: 'visor-abrir'
      - assertNotVisible: 'Reintentar'
      - assertNotVisible: 'Descargar'
      - assertVisible: 'Seguir andando'
