# @app — La repisa dentro del móvil (SPEC-038).
#
# Aquí vive **solo lo que necesita dispositivo**, que en esta fila es una cosa y no
# quince, porque el reparto de la spec está elegido para eso: el orden de los objetos, la
# procedencia de cada uno, los motes del mapa activo, la línea del oro, los estados
# vacíos y las diecisiete ausencias declaradas son funciones puras sobre el estado y se
# afirman en `test/nucleo/repisa.test.mjs`, que corre sin simulador. Lo único que no se
# puede ver sin dispositivo es:
#
# 1. **Que la repisa se lea y no se opere.** Los tres gestos que un inventario tendría
#    —pulsación larga, deslizar para borrar, arrastrar para ordenar— **no están conectados
#    a nada**. En el dato ya se afirma que no existe la función que quitaría un objeto;
#    que además la lista no responda al gesto solo se ve tocándola.
# 2. **Que la serif sea la serif.** Maestro no compara tipografías, pero sí puede afirmar
#    que la pantalla declara registro de mundo, que es de donde sale.
#
# **NO SE EJECUTA EN LA MÁQUINA DE ESTE PIPELINE.** No hay Xcode completo ni SDK de
# Android, así que ningún flujo `@app` se puede correr aquí
# (`pipeline/decisiones-orquestador.md` §4). El flujo se escribe igual y el runner lo
# registra como infraestructura ausente, nunca como verde.
#
# **Lo que este flujo necesita para poder pasar, y hoy no tiene:**
#
# - **Una puerta hasta la pantalla.** `app/pantallas/repisa.jsx` existe y está entera,
#   pero **`App.js` no la monta**: no hay ningún camino que lleve a la repisa en un
#   dispositivo. El primer paso de abajo va contra `paso-repisa`, que es el nombre que le
#   corresponde por la convención de los otros pasos provisionales (`paso-mapa`,
#   `paso-marcha`, `paso-revision-render`) y que **todavía no existe**. Es un hueco de
#   cableado y no de este flujo.
# - **Una partida de andamiaje con objetos y motes ya ganados**, porque la repisa de una
#   partida recién empezada son dos líneas y el oro. Hoy el andamiaje no la trae.
#
# **Lo que este flujo NO puede comprobar, y por qué:**
#
# - **Que el oro esté «al pie y en pequeño».** Maestro no mide cuerpos de letra. Lo que sí
#   se afirma, en `@nucleo`, es que la línea se compone del saldo y que es la única cifra.
# - **Que los motes vayan debajo de los objetos y en la misma columna.** Maestro no
#   compara posiciones; lo que se afirma es que las dos listas salen de la misma
#   proyección y que no hay pestañas ni secciones plegables a las que tocar.
#
# Los elementos se localizan por los identificadores que declara la spec —`momento`,
# `repisa-objetos`, `repisa-objeto`, `repisa-motes`, `repisa-mote`, `repisa-oro`— y nunca
# por su posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «La repisa no es un inventario»
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# El paso a la repisa, provisional como el del mapa y el de la marcha. Hoy no existe.
- tapOn:
    id: 'paso-repisa'

# ── La repisa no es un inventario ──────────────────────────────────────────────
# Se abre en momento de consulta, con los objetos y, debajo, los motes.

- assertVisible:
    id: 'momento'
- assertVisible: 'de-consulta'
- assertVisible: 'La repisa'
- assertVisible:
    id: 'repisa-objetos'
- assertVisible:
    id: 'repisa-objeto'
- assertVisible: 'Y cómo te llaman'
- assertVisible:
    id: 'repisa-motes'
- assertVisible:
    id: 'repisa-oro'

# Ni peso, ni huecos, ni contadores, ni casillas, ni iconos: nada de lo que un inventario
# enseña. Se afirma por texto porque ninguna de estas cosas tiene localizador, y no lo
# tiene porque no existe.
- assertNotVisible: 'Peso'
- assertNotVisible: 'peso:'
- assertNotVisible: 'Capacidad'
- assertNotVisible: 'Huecos'
- assertNotVisible: 'Equipar'
- assertNotVisible: 'Ordenar'
- assertNotVisible: 'Combinar'
- assertNotVisible: 'Descartar'
- assertNotVisible: 'Tirar'
- assertNotVisible:
    id: 'repisa-peso'
- assertNotVisible:
    id: 'repisa-ordenar'
- assertNotVisible:
    id: 'repisa-tirar'

# Y una llave no se anuncia como llave: nada distingue al que abre puertas.
- assertNotVisible: 'Llave'
- assertNotVisible: 'Abre'

# ── Los tres gestos de inventario no están conectados a nada ───────────────────
# Es lo único de esta fila que no se puede afirmar sin dispositivo: la lista no responde,
# y después de los tres gestos la repisa sigue igual, con el mismo objeto en el mismo
# sitio.

- longPressOn:
    id: 'repisa-objeto'
- assertVisible:
    id: 'repisa-objeto'
- assertNotVisible: 'Tirar'
- assertNotVisible: 'Eliminar'
- assertNotVisible: 'Quitar de la repisa'

- swipe:
    from:
      id: 'repisa-objeto'
    direction: LEFT
- assertVisible:
    id: 'repisa-objeto'
- assertNotVisible: 'Borrar'
- assertNotVisible: 'Eliminar'

- swipe:
    from:
      id: 'repisa-objeto'
    direction: DOWN
- assertVisible:
    id: 'repisa-objeto'
- assertVisible:
    id: 'repisa-motes'

# ── Se lee de arriba abajo y no se navega ──────────────────────────────────────
# Una sola columna: ni pestañas, ni secciones plegables, ni buscador, ni filtro.
- assertNotVisible:
    id: 'repisa-pestanas'
- assertNotVisible:
    id: 'repisa-buscador'
- assertNotVisible:
    id: 'repisa-filtro'
- assertNotVisible:
    id: 'barra-de-pestanas'

# Y la única salida es volver, que es lo que hace una pantalla de consulta.
- assertVisible: '‹ Volver'
- tapOn: '‹ Volver'
- assertNotVisible: 'La repisa'
