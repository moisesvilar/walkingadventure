# @app @accesibilidad — El gancho para poner una capacidad en rojo (SPEC-020).
#
# **Recorre su pantalla desde el 10-ago-2026.** Hasta la fila 45 este flujo llevaba
# `@limite-declarado`: la app abre en el arranque y al andamiaje no se llegaba por ningún
# sitio. Ahora hay una **puerta declarada de desarrollo** —el enlace
# `walkingadventure://desarrollo`—, y este flujo entra por ella.
#
# Que la puerta sea de desarrollo y no del juego es deliberado y está razonado en
# `pipeline/decisiones-orquestador.md` §6y: verificar una pantalla del juego por una puerta
# que ningún jugador usa es deuda, y verificar una herramienta de desarrollo por la puerta
# de desarrollo es la puerta correcta. Lo que decide el caso es si lo que hay detrás sale
# en `docs/flujo.md`, y el andamiaje no sale ni puede salir.
#
# Es lo que hace que «la app funciona aunque falten» se pueda poner ROJO en lugar
# de afirmarse: se fuerzan capacidades a ausentes por enlace profundo y se
# comprueba que la app sigue en pie y lo declara. El gancho no escribe nada, así
# que al relanzar sin enlace las capacidades vuelven a su estado real.
#
# Solo corre en una compilación de desarrollo: en producción el enlace es inerte.

appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# La puerta de desarrollo, que es como se llega al andamiaje desde la fila 45. No es
# navegación del juego: el andamiaje no sale en `docs/flujo.md` porque no es una pantalla
# de diseño, es la sonda de las cuatro capacidades de plataforma. En producción este enlace
# no existe.
#
# **Se espera a que la app esté viva antes de abrir el enlace.** Medido en `wa-pixel`: con
# `clearState: true` el arranque en frío tarda unos veinte segundos en tener el puente de
# JavaScript montado, y el enlace se entrega por `Linking.addEventListener`, que hasta
# entonces no existe. Lanzarlo antes lo pierde sin que nada lo diga. Esto es espera y no
# lógica, así que va con `extendedWaitUntil` y no bajando ninguna afirmación.
- extendedWaitUntil:
    visible:
      id: 'arranque'
    timeout: 60000
- openLink: 'walkingadventure://desarrollo'
- extendedWaitUntil:
    visible:
      id: 'pantalla-andamiaje'
    timeout: 20000

- openLink: 'walkingadventure://andamiaje?ausentes=haptico,notificaciones,respaldo'

- assertVisible:
    id: 'pantalla-andamiaje'
- assertVisible:
    id: 'capacidades'
- assertVisible: 'Háptico — no montada'
- assertVisible: 'Notificaciones — no montada'
- assertVisible: 'Respaldo — no montada'
- assertVisible: '.*ausente por el gancho de andamiaje.*'

# Ninguna parte de la pantalla queda vacía por ello: el título sigue ahí.
- assertVisible:
    id: 'titulo-de-mundo'

# Un nombre que no es ninguna de las cuatro no cambia nada y se dice cuál fue.
- openLink: 'walkingadventure://andamiaje?ausentes=telepatia'
- assertVisible:
    id: 'gancho-no-reconocido'
- assertVisible: '.*No reconozco la capacidad «telepatia».*'

# Al relanzar sin enlace, el estado real vuelve: el gancho no persiste nada.
#
# Y **la puerta tampoco persiste**, que es la otra mitad del mismo criterio y desde la fila
# 45 se ve aquí: al relanzar, la app abre donde le toca por su estado —el arranque— y no en
# el andamiaje. Hay que volver a abrir la puerta para mirar las capacidades, y eso es lo
# correcto: una puerta de desarrollo que sobreviviera al reinicio sería una puerta trasera.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'arranque'
    timeout: 60000
- assertNotVisible:
    id: 'pantalla-andamiaje'
- openLink: 'walkingadventure://desarrollo'
- extendedWaitUntil:
    visible:
      id: 'pantalla-andamiaje'
    timeout: 20000
- assertVisible:
    id: 'capacidad-haptico'
- assertNotVisible: '.*ausente por el gancho de andamiaje.*'
