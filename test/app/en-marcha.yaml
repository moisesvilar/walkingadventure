# @app — El momento «en marcha» dentro del móvil (SPEC-029, cableado por SPEC-048).
#
# **Este flujo salió de la columna de límite declarado con la fila 48**, y con el número
# delante: hasta entonces `app/pantallas/en-marcha.jsx` estaba entera y **no la montaba
# nadie**, así que lo único que se ejecutaba era una guarda que comprobaba que su pantalla
# seguía sin existir. Desde SPEC-048 hay camino de verdad: se recorre el arranque, se llega
# a la portada y «Salir a andar sin más» abre una salida —con su rótulo del sistema y su
# única suscripción al sensor— y deja el momento en marcha en pantalla. Medido en `wa-pixel`
# el 11-ago-2026: **86 s de principio a fin**, con el arranque entero dentro. Un flujo que
# tarda diez segundos no ha recorrido nada; este recorre.
#
# La lista de flujos marcados la fija `test/nucleo/limite-declarado.test.mjs`, y quitar el
# marcador sin quitarlo de allí pone la suite en rojo. Las dos cosas se hicieron en el mismo
# cambio, que es lo que convierte bajar el número en un acto con registro.
#
# Aquí vive **solo lo que necesita dispositivo**: que se llegue al momento desde donde entra
# una persona, que la lámina ocupe la pantalla de verdad de borde a borde, que la marca de
# posición se pinte **en el sitio del mundo donde estás** y no en el centro, y que no haya
# ni un elemento tocable ni una cifra. Todo lo demás de la fila —el vocabulario cerrado de
# la avería, la cadena fuente→detector→seguidor, el plazo del rótulo, el regreso y las
# promesas de privacidad— se afirma en `test/nucleo/marcha.test.mjs`, `en-marcha.test.mjs`,
# `avisos.test.mjs` y `salidas.test.mjs`, que corren sin simulador. Duplicar aquí lo que ya
# se puede poner rojo en Node solo añadiría un flujo lento que se cae por el entorno, y en
# esta fila pesa más que en ninguna: **casi todo lo que hay que afirmar son ausencias, y una
# ausencia es justo lo que peor se comprueba mirando.**
#
# **Lo que este flujo NO puede comprobar, y por qué. Medido, no supuesto:**
#
# - **Que la marca se mueva.** `setLocation` de Maestro es `adb emu geo fix`, y en esta
#   máquina **devuelve OK y no mueve nada**: medido el 11-ago-2026, tres fijos seguidos
#   dejaron la etiqueta de `marca-posicion` idéntica. Es la trampa que la bitácora de la
#   fila 48 documenta —un mock de `fused_location_provider` que se re-emite solo, y que solo
#   se quita reiniciando el emulador—. Meter aquí una afirmación que depende de eso
#   convertiría el estado del emulador en el resultado de la prueba. Que la posición se
#   mueve y que el detector clasifica **está medido a mano** y anotado en `docs/starting.md`
#   con el recorrido concreto; en cuanto `geo fix` sea fiable, esas líneas van aquí.
# - **Las marcas apiladas del momento.** `momento-en-marcha`, `en-marcha-elementos`,
#   `en-marcha-tocables`, `en-marcha-orientacion`, `mapa-camara` y `ubicacion-estado` son
#   `MARCA_SUPERPUESTA`, o sea 1 dp anclado a la esquina del contenedor, y **las seis caen
#   en el mismo `[0,0][3,3]`**. Maestro descarta como invisible todo lo que queda tapado por
#   un hermano, así que solo la última se puede afirmar. Medido una a una: `en-marcha` y
#   `mapa-lamina` pasan —tienen tamaño—, `marca-posicion` pasa —está en su sitio del mundo—,
#   y las seis apiladas no. **Es un defecto de la app y no de este flujo**: es exactamente
#   lo que la cabecera de `app/pantallas/marca.js` arregló una vez pasando de 0×0 a 1×1, con
#   el mismo argumento —«una marca que ninguna prueba puede leer no es una marca, es un
#   comentario»— y ahora vuelve por apilamiento. Lo que se afirma de ellas se afirma en
#   `test/nucleo/marcha.test.mjs` sobre la composición, que sí lo alcanza.
# - **Que el háptico se note desde el bolsillo.** Maestro ve la pantalla, no el motor
#   háptico, y el emulador no vibra. Es `@manual`, y está en `docs/testing.md`.
# - **Andar veinte minutos con el móvil bloqueado.** También `@manual`.
# - **Tocar la notificación del rótulo.** Maestro no interactúa con la pantalla de bloqueo
#   ni con el centro de notificaciones del sistema.
#
# **Lo que este flujo necesita para pasar**: instalación limpia —al momento en marcha se
# llega saliendo del arranque, que es hoy el único camino—, el proxy alcanzable desde el
# emulador (`EXPO_PUBLIC_PROXY`) y el permiso de ubicación concedido. Si la salida no se
# abre, este flujo se pone rojo en `en-marcha`, y eso es un rojo de verdad: significa que
# echarse a andar no abre nada.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «La pantalla del mapa no tiene ni un control»
#   «No se enseña ninguna cifra de esfuerzo»
#   «El momento en marcha se alcanza andando desde la portada»
#
appId: com.walkingadventure.app
---
# Al momento en marcha se llega saliendo del arranque y pasando por la portada, que es por
# donde entra una persona. El flujo del arranque ya está escrito y se reutiliza entero.
- runFlow:
    file: arranque.yaml

# ── A2P1 · La portada, y echarse a andar ───────────────────────────────────────
- assertVisible:
    id: 'portada'
- assertVisible:
    id: 'salir-sin-mas'
- tapOn:
    id: 'salir-sin-mas'

# ── A3P1 · En marcha ───────────────────────────────────────────────────────────
#
# Abrir la salida arranca el servicio en primer plano y pide una posición puntual, así que
# se espera en vez de afirmar a la primera: es espera, no lógica.
- extendedWaitUntil:
    visible:
      id: 'en-marcha'
    timeout: 30000

# El momento se montó de verdad: **no está la avería**. Si el rótulo no estuviera, si el
# permiso estuviera denegado o si el sensor no respondiera, lo que habría aquí es
# `en-marcha-sin-cablear` con su motivo, y eso es rojo y no otra pantalla.
- assertNotVisible:
    id: 'en-marcha-sin-cablear'

# La lámina a sangre: se dibuja en Skia y ocupa la pantalla entera. Es lo único de esta
# fila que no se puede afirmar sin dispositivo, porque «de borde a borde» es una propiedad
# del hueco real y no de la composición.
- assertVisible:
    id: 'mapa-lamina'

# La marca de posición, roja y del propio mapa. Su etiqueta lleva **de cuál de las dos es,
# el punto en metros del mundo y la clasificación del último segmento**, que es lo que
# permitiría leerla moverse sin mirar la pantalla el día que `geo fix` sea fiable.
- assertVisible:
    id: 'marca-posicion'
- assertVisible: 'del-mapa:.*'

# ── Ni un control tocable ──────────────────────────────────────────────────────
# Los controles que el momento prohíbe son los identificadores que tendría que declarar
# quien los añadiese, y su ausencia es la entrega.
- assertNotVisible:
    id: 'control-tocable'
- assertNotVisible:
    id: 'barra-de-pestanas'
- assertNotVisible:
    id: 'cabecera'
- assertNotVisible:
    id: 'control-de-zoom'
- assertNotVisible:
    id: 'boton-de-centrar'
- assertNotVisible:
    id: 'leyenda'
- assertNotVisible:
    id: 'boton-de-aceptar'
- assertNotVisible:
    id: 'boton-de-descartar'
# Y la portada queda atrás: se anda, no se elige.
- assertNotVisible:
    id: 'portada'
- assertNotVisible:
    id: 'salir-sin-mas'

# ── Ninguna cifra de esfuerzo ──────────────────────────────────────────────────
# A3P7 es la pantalla que está dibujada para no hacerse: ninguno de sus elementos existe.
- assertNotVisible:
    id: 'kilometros'
- assertNotVisible:
    id: 'ritmo'
- assertNotVisible:
    id: 'pasos'
- assertNotVisible:
    id: 'porcentaje-de-aventura'
- assertNotVisible:
    id: 'racha'
- assertNotVisible: '.*\d+\s*(km|kcal|min|minutos)\b.*'
- assertNotVisible: '.*\d+\s*%.*'

# ── Acercar y arrastrar siguen siendo gestos ───────────────────────────────────
# Un gesto no es un control: arrastrar mueve el encuadre y no acepta nada. Después del
# gesto la pantalla sigue siendo la misma y no ha aparecido ningún control.
- swipe:
    start: '50%, 60%'
    end: '30%, 40%'
- assertVisible:
    id: 'en-marcha'
- assertVisible:
    id: 'mapa-lamina'
- assertNotVisible:
    id: 'boton-de-centrar'
- assertNotVisible:
    id: 'boton-de-aceptar'

# ── La salida sigue abierta al volver a la app ─────────────────────────────────
#
# Cerrar y reabrir no la pierde: la sostiene el servicio en primer plano, y al arrancar la
# app se reconcilia con lo que de verdad hay en la pantalla de bloqueo. Lo que se ve al
# volver **no es el momento en marcha sino la portada con la tarjeta de a medias**, y es lo
# correcto: andar es una decisión de quien anda y la app no la retoma sola. La tarjeta solo
# existe con la salida abierta, y aquí lleva sus dos acciones.
#
# Que la reconciliación corrija lo que el estado creía cuando el sistema mata el servicio se
# afirma en `test/nucleo/marcha.test.mjs`, que sí puede matarlo a mano.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'portada'
    timeout: 30000
- assertVisible:
    id: 'salida-situacion'
- assertVisible: 'abierta-con-rotulo'
- assertVisible:
    id: 'rotulo-estado'
- assertVisible: 'puesto'
- assertVisible:
    id: 'tarjeta-a-medias'
- assertVisible:
    id: 'a-medias-seguir'
- assertVisible:
    id: 'a-medias-dejarlo'

# Y «seguir con ella» vuelve al momento en marcha sin volver a preparar nada.
- tapOn:
    id: 'a-medias-seguir'
- extendedWaitUntil:
    visible:
      id: 'en-marcha'
    timeout: 30000
- assertVisible:
    id: 'marca-posicion'
- assertNotVisible:
    id: 'en-marcha-sin-cablear'
