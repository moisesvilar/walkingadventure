# @app — El primer flujo que toca un dispositivo (SPEC-020).
#
# @limite-declarado
#
# Este flujo **no recorre su pantalla**: la app abre en el arranque —`enArranque =
# true`— y al andamiaje solo se llega saliendo de él sin partida levantada. Lo único
# que llega a ejecutarse es la guarda de más abajo, así que su verde significa «el
# límite sigue en pie» y nunca «la pantalla funciona», y por eso no se cuenta en la
# misma casilla que un verde de verdad. El porqué entero y lo que haría falta para
# levantarlo están en «LÍMITE DECLARADO», unas líneas más abajo.
#
# La lista de flujos marcados está fijada en `test/nucleo/limite-declarado.test.mjs`:
# poner o quitar este marcador sin tocar aquella lista pone la suite en rojo, que es
# lo que convierte marcar y desmarcar en un acto deliberado y visible.
#
# Comprueba lo único que esta fila entrega: que la app arranca, que la pantalla de
# andamiaje está entera, que el título de mundo lo pinta el núcleo y que las cuatro
# capacidades se enumeran. Los elementos se localizan por los identificadores que
# declara la spec, nunca por su texto: el texto de una capacidad cambia con el
# dispositivo y el identificador no.
#
# El título esperado es el que el mismo paquete produce en Node con la semilla
# 42.40,-8.81#1, y esa comparación es la prueba de RF-INFRA-001 dentro del móvil.

appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# ── LÍMITE DECLARADO ───────────────────────────────────────────────────────────
#
# Este flujo daba por hecho que la app abre en el andamiaje, y **no abre ahí**.
# `app/App.js` arranca con `enArranque = true`, así que lo primero y lo único que se ve
# al instalar es el arranque de A1P1. El andamiaje sigue existiendo y `PantallaAndamiaje` se monta, pero solo cuando se sale del arranque **sin partida levantada**: hay que recorrer las siete pantallas de A1 para llegar, y este flujo no las recorre.
#
# Mientras la app abra donde abre, este flujo **no recorre nada y lo dice**: comprueba
# que sigue sin haber camino y que la app abre en el arranque. Su verde significa «el
# límite declarado sigue en pie», nunca «la pantalla está verificada». El día que haya
# camino, la condición cambia sola y el cuerpo de abajo se ejecuta entero.
- runFlow:
    when:
      notVisible:
        id: 'pantalla-andamiaje'
    commands:
      - assertVisible:
          id: 'arranque'
      - assertNotVisible:
          id: 'pantalla-andamiaje'

# El flujo de verdad, a la espera de su camino.
- runFlow:
    when:
      visible:
        id: 'pantalla-andamiaje'
    commands:
      - assertVisible:
          id: 'pantalla-andamiaje'

      # La pantalla se declara herramienta: si esto desaparece sin que la fila 27 la
      # haya sustituido, es que alguien la ha empezado a tratar como pantalla de juego.
      - assertVisible: 'Andamiaje. Esto no es el juego.*'

      - assertVisible:
          id: 'titulo-de-mundo'

      # Idéntico al de Node: namesFor(localeFor(42.40, -8.81)).worldTitle(makeRng('42.40,-8.81#1:title')).
      - assertVisible: '«Reinos de Vaeloria»'

      - assertVisible: 'semilla 42.40,-8.81#1 · idioma gl'

      - assertVisible:
          id: 'capacidades'

      - assertVisible:
          id: 'capacidad-salud'
      - assertVisible:
          id: 'capacidad-haptico'
      - assertVisible:
          id: 'capacidad-notificaciones'
      - assertVisible:
          id: 'capacidad-respaldo'

      # La salud queda declarada no montada, nombrando a su dueña.
      - assertVisible: 'Salud — no montada'
      - assertVisible: '.*la monta la fila 42.*'

      # Ni el núcleo caído ni la lista vacía: los dos estados existen y aquí no tocan.
      - assertNotVisible:
          id: 'nucleo-error'
      - assertNotVisible:
          id: 'capacidades-vacio'
      - assertNotVisible:
          id: 'gancho-no-reconocido'

      # Sin cifras de distancia, tiempo, ritmo, pasos ni progreso en toda la pantalla.
      - assertNotVisible: '.*\d+\s*(km|m|min|pasos|%).*'
