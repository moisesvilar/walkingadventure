# @app — La escena de un beat y lo que te llevas dentro del móvil (SPEC-034, cableada
# por SPEC-049).
#
# @limite-declarado
#
# Este flujo **no recorre su pantalla**, y desde SPEC-049 el motivo es otro: la pantalla
# existe, está montada y se alcanza andando, pero **un flujo no puede garantizar llegar
# a ella**. Lo único que se ejecuta es la guarda de más abajo, así que su verde significa
# «el límite sigue en pie» y nunca «la pantalla funciona», y por eso no se cuenta en la
# misma casilla que un verde de verdad. El porqué medido está en «LÍMITE DECLARADO»,
# unas líneas más abajo.
#
# La lista de flujos marcados está fijada en `test/nucleo/limite-declarado.test.mjs`:
# poner o quitar este marcador sin tocar aquella lista pone la suite en rojo, que es
# lo que convierte marcar y desmarcar en un acto deliberado y visible.
#
# Aquí vive **solo lo que necesita dedo o pantalla**: que la escena tenga una sola acción
# tocable y ninguna flecha de volver, que el ajuste de tamaño de letra recorra la escala
# con toques sin abrir panel ni recargar nada, y que el escalón elegido siga puesto al
# entrar en la escena siguiente. Todo lo demás —la composición de la escena, el titular y
# el verbo de cada tipo, el cierre por resultado, la variante de franja, las dos vías del
# objeto, que no aparezca ninguna cifra y que ningún texto se disculpe— se afirma en
# `test/nucleo/escena.test.mjs` y, desde SPEC-049, el cableado entero en
# `test/nucleo/escena-cableada.test.mjs`, que corren sin simulador. **La decisión vive en
# el paquete justamente para que no haga falta un dispositivo para ponerla roja**, y
# duplicarla aquí solo añadiría un flujo lento.
#
# **YA SE EJECUTA.** Este párrafo decía que en esta máquina no había Xcode ni SDK de
# Android y que ningún flujo `@app` podía correrse; desde que hay emulador —`wa-pixel`,
# API 35, con la app instalada— es falso, y dejarlo puesto haría que un rojo de verdad
# se leyera como infraestructura ausente. Lo que este flujo diga sobre la app se ha
# medido contra la app.
#
# ── LÍMITE DECLARADO, con el motivo medido ────────────────────────────────────
#
# **El motivo viejo era falso y se retira.** Decía que faltaba `paso-escena` en
# `app/App.js` y que hacía falta montarlo. Hoy es falso por partida doble: la escena se
# monta —`app/pantallas/escena.js`, inyectada en `PantallaLlegada` por su tipo de paso—
# y **esa puerta no debe existir**. SPEC-049 lo dice con todas las letras: la ausencia
# de rutas es la pieza, porque no hay manera de llegar a A4P3 sin haber llegado al sitio,
# y publicar una puerta de servicio para que una prueba entre sería exactamente lo que la
# spec prohíbe. Un límite declarado por un motivo que ya no es el suyo es peor que no
# declararlo.
#
# **Lo que de verdad lo mantiene aquí, medido y no supuesto, son tres cosas que se suman:**
#
# 1. **Dónde nace el mundo no lo decide el flujo.** `app/plataforma/ubicacion.js` lee la
#    coordenada del arranque con `getCurrentPositionAsync({ accuracy: Balanced })` y un
#    fijo simulado no manda sobre esa lectura: con `setLocation` a `42.4000,-8.7700` el
#    mapa nació en `42.40,-8.76` en dos tandas seguidas. Medido por la fila 44 y anotado
#    en `test/app/llegada.yaml`.
# 2. **La semilla nace de entropía real y el arranque no ofrece dónde escribirla.**
#    `app/datos/entropia.js` la produce con `creaSemilla` y `app/pantallas/arranque.jsx`
#    no tiene ningún `testID` de semilla, así que con `clearState: true` **cada tanda
#    genera un mundo distinto**. Qué aventuras hay y dónde caen sus beats cambia en cada
#    ejecución.
# 3. **El flujo no puede andar hasta el beat.** `setLocation` de Maestro **no mueve la
#    marca**: medido el 11-ago-2026 y vuelto a medir el 12-ago-2026 sobre una salida
#    abierta, sale con código 0 y `marca-posicion` se queda donde estaba. `adb emu geo
#    fix` con esa misma coordenada **sí la mueve** —no son el mismo mecanismo, y la nota
#    de `test/app/en-marcha.yaml` que decía lo contrario está corregida—, pero un flujo
#    de Maestro no tiene manera de invocar un comando del sistema. Sin poder moverse, lo
#    único que valida es el sitio bajo el que arranca el mapa, y ese sitio es el que salga.
#
# Juntas: **qué sitio tiene beat no es reproducible entre tandas**, así que no se pueden
# escribir coordenadas en el flujo como se escriben las formas en `llegada.yaml`.
#
# Había una cuarta pieza y **ya no está**: decía que no podía saltar ningún micro-encuentro
# porque `siembraLaCola` no tenía llamador desde `app/`, así que `atraviesa()` salía siempre
# por `if (!cola.length) return null`. Era deuda de la fila 19 y la cerró la 50: la cola se
# siembra al nacer la partida, y una salida sin aventura aceptada sí puede producir un paso
# de beat. Lo que mantiene este flujo en la columna son las **tres** de arriba, que son de
# reproducibilidad y no de cableado.
#
# **Qué levantaría el límite**, para que quede escrito y no haya que volver a medirlo:
# que el arranque acepte una semilla escrita —que es una decisión de producto, no una
# puerta de pruebas—, o que Maestro llegue a mover la marca, que permitiría aceptar una
# aventura y andar hasta su primer beat. Cualquiera de las dos, sola, deja el cuerpo de
# abajo ejecutándose sin tocar una línea de este fichero.
#
# **Y lo que NO lo levanta, para que nadie lo intente dos veces:** matar la app y
# reabrirla. Ese camino es el que saca a `test/app/telon.yaml` de esta columna —al telón
# se llega sin moverse, por la tarjeta de a medias—, pero aquí no sirve de nada: reabrir
# la app no cambia dónde nació el mundo ni qué sitio tiene beat.
#
# **Lo que este flujo NO puede comprobar aunque se levante el límite, y por qué:**
#
# - **Que el texto se vea más grande.** Maestro no mide tipografías. Lo que sí se comprueba
#   es que el control existe, que tocarlo no saca a nadie de la escena y que el estado del
#   momento no cambia; el tamaño en píxeles es pintado y va en la revisión `@manual`.
# - **Que el ajuste sea el mismo que enseña la pantalla de ajustes (A6P6).** Esa pantalla
#   es de la fila 38 y todavía no existe; el paquete ya comparte la escala
#   (`ESCALA_DE_TEXTO`) y eso se afirma en `@nucleo`.
# - **El bloque de quien habla.** Medido en SPEC-049 sobre los cuatro mundos de
#   referencia: **0 de 506 beats casteados caen sobre un rol humano**, así que
#   `escena-cara` no existe hoy en ningún mundo. El cuerpo de abajo lo afirma como
#   condicional por eso, y el número está fijado en
#   `test/nucleo/escena-cableada.test.mjs`.
#
# Los elementos se localizan por los identificadores que declara la spec y nunca por su
# posición en pantalla.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «Un solo botón y ninguna manera de volver atrás»
#   «El tamaño del texto se cambia sin salir de la escena»
#   «El tamaño elegido sigue puesto en la escena siguiente»
#
appId: com.walkingadventure.app
---
- launchApp:
    clearState: true

# La guarda del límite: con el estado limpio la app abre en el arranque y la escena no
# está a la vista, porque para verla hay que haber aceptado una aventura y haber llegado
# a su primer beat. Se condiciona sobre `escena`, que es el identificador de la propia
# pantalla y no el de ninguna puerta: el día que haya camino hasta ella, la condición
# cambia sola y el cuerpo de abajo —que está entero, tal y como se escribió— pasa a
# ejecutarse sin tocar una línea de este fichero.
- runFlow:
    when:
      notVisible:
        id: 'escena'
    commands:
      - assertVisible:
          id: 'arranque'
      - assertNotVisible:
          id: 'escena'

# El flujo de verdad, a la espera de una tanda en la que el sitio de arranque traiga beat.
- runFlow:
    when:
      visible:
        id: 'escena'
    commands:
      # ── Un solo botón y ninguna manera de volver atrás ─────────────────────────────

      - assertVisible:
          id: 'escena-estado'
          text: 'escena'
      - assertVisible:
          id: 'escena'
      - assertVisible:
          id: 'escena-texto'

      # La única acción que avanza. Su rótulo es el verbo de lo que se hace y nunca
      # «Continuar», que sería un botón de aplicación.
      - assertVisible:
          id: 'escena-accion'
      - assertNotVisible: 'Continuar'

      # Ninguna flecha de volver: la llegada encadena y no se navega (`bucle-jugable.md` §2).
      # Una flecha convertiría la secuencia en un menú y dejaría un beat a medio resolver, que
      # es un estado que el motor no tiene.
      - assertNotVisible:
          id: 'volver'
      - assertNotVisible:
          id: 'cabecera-atras'

      # Y ningún retrato de quien habla: exclusión 6 del PRD. El bloque de la cara, cuando lo
      # hay, es su nombre y su puesto en una línea y no lleva imagen. **Hoy no lo hay en
      # ningún mundo de referencia** —0 de 506 beats caen sobre un rol humano—, así que lo que
      # se afirma sin condición es la ausencia del retrato.
      - assertNotVisible:
          id: 'escena-cara-retrato'

      # Tampoco se anuncia la franja: ni reloj en pantalla, ni aviso de haber llegado tarde.
      - assertNotVisible:
          id: 'escena-reloj'
      - assertNotVisible: 'Llegas tarde'

      # ── El tamaño del texto se cambia sin salir de la escena ───────────────────────

      - assertVisible:
          id: 'escena-tamano-texto'
          text: 'Tamaño del texto'

      # Cada toque avanza un escalón. Ni panel, ni deslizador, ni previsualización: después de
      # tocar se sigue en la misma escena y el texto sigue ahí.
      - tapOn:
          id: 'escena-tamano-texto'
      - assertVisible:
          id: 'escena-estado'
          text: 'escena'
      - assertVisible:
          id: 'escena-texto'
      - assertNotVisible:
          id: 'ajustes-panel'

      # Y no hay ninguna cifra: ni número de escalón, ni porcentaje.
      - assertNotVisible: '100%'
      - assertNotVisible: '125%'

      # Tres escalones y vuelta al principio: tres toques más dejan la escena donde estaba, sin
      # haber salido de ella en ningún momento. Y sin volver a A4P3 desde lo que te llevas, que
      # es el defecto que SPEC-049 midió y arregló subiendo esa mitad al montaje del paso.
      - repeat:
          times: 3
          commands:
            - tapOn:
                id: 'escena-tamano-texto'
            - assertVisible:
                id: 'escena-estado'
                text: 'escena'

      # ── El tamaño elegido sigue puesto en la escena siguiente ──────────────────────

      # Se deja el escalón en el segundo y se avanza el beat.
      - tapOn:
          id: 'escena-tamano-texto'
      - tapOn:
          id: 'escena-accion'

      # Lo que te llevas — A4P4. Misma voz, una sola acción, y el nombre del sitio siguiente
      # salvo en el último beat de la cadena.
      - assertVisible:
          id: 'escena-estado'
          text: 'lo-que-te-llevas'
      - assertVisible:
          id: 'lo-que-te-llevas'
      - assertNotVisible:
          id: 'volver'
      - tapOn:
          id: 'escena-accion'

      # Cerrado el paso, debajo está lo que la secuencia diga y nunca el mapa a mitad de
      # llegada: la escena que espera manda sobre todo lo demás.
      - assertNotVisible:
          id: 'mapa-lamina'
