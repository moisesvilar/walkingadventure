# @app — La apertura de una salida: la espera que se dice, y de qué puerta salió el punto de
# partida (SPEC-048-iter-1).
#
# ## Qué necesita aparato de esta fila, y qué no
#
# Casi todo lo de la apertura es función pura y vive en `@nucleo`: la cota única para las dos
# puertas, la precisión exigida, el tope, el re-anclaje con su plazo y su inmutabilidad, y los
# cuatro escalares del anclaje están en `test/nucleo/salidas.test.mjs` y
# `test/nucleo/marcha.test.mjs`, que corren sin simulador y sin desactualizarse. Duplicarlo
# aquí solo añadiría un flujo lento que se cae por el entorno.
#
# Lo que **solo se ve en un aparato** es esto, y por eso este flujo existe:
#
# 1. **Que la espera aparezca al instante y desaparezca siempre.** Pedir la puntual con
#    precisión alta enciende el GPS y eso cuesta segundos; la elección real no es entre rápido
#    y lento sino entre espera muda y espera dicha, y una espera muda se lee como una app
#    colgada. Lo que se afirma abajo es la mitad que un flujo puede ver sin cronómetro: que
#    **no se queda puesta**, ni cuando la salida se abre ni cuando no.
# 2. **De qué puerta salió el punto de partida y si se re-ancló**, que sobre la función pura
#    se afirma y sobre el aparato no se podía: hasta esta fila, que la apertura cayera al
#    respaldo solo se deducía de que la salida se había abierto.
#
# ## Lo que este flujo NO puede comprobar, dicho antes de que se lea como un descuido
#
# - **Cuánto tarda la apertura.** Maestro no cronometra, así que el tope de espera —10 s
#   declarados— no se afirma aquí. La medida va a mano, con el reloj al lado, y se escribe con
#   el número: es lo que la spec deja pendiente y lo que confirma o cambia ese tope.
# - **Que la línea de espera se lea durante la búsqueda.** Es una carrera: si el proveedor
#   responde en dos segundos, el selector puede no llegar a verla. Por eso lo que se afirma es
#   la ausencia después, que sí es estable, y no la presencia durante.
# - **Que el GPS se encienda de verdad.** Eso se mide con `dumpsys location` y su Event Log, a
#   mano, y con la precondición del bucle de posición declarada: `adb emu geo fix` **no
#   inyecta nada si nadie pide posición**, así que un `dumpsys` con fijo viejo no prueba que el
#   bucle no esté alimentando — prueba que nadie ha pedido.
#
# ## Precondiciones de la tanda, que van declaradas o los números no dicen nada
#
# - Aparato limpio: `adb shell pm clear com.walkingadventure.app` y reinstalar. Este flujo
#   recorre el arranque entero y necesita el permiso de ubicación en su estado de origen.
# - El bucle de posición corriendo **y comprobado pidiendo posición**, no mirando `dumpsys`.
#
# ## Riesgo conocido de este flujo, sin medir
#
# Las tres marcas que afirma —`salida-buscando`, `salida-punto-origen` y `salida-reanclaje`—
# las pinta `app/pantallas/antes-de-salir-montado.jsx` con `marcaSuperpuesta(n, { fila })`, o
# sea a uno y dos puntos de la esquina del contenedor. `app/pantallas/marca.js` tiene medido
# que en una pantalla a sangre eso cae debajo de la ventana de la barra de estado y quien lee
# el árbol lo descarta, y por eso existe `LEJOS_DE_LA_BARRA_DE_ESTADO`. Sus hermanas
# `salida-situacion` y `rotulo-estado` llevan ahí desde SPEC-048 y **no se ha medido si se
# alcanzan**. Si este flujo cae en una de esas tres líneas, lo primero que hay que comprobar es
# eso —volcando la jerarquía con `maestro hierarchy`, que es el instrumento que decide— y no
# la lógica de la apertura: sería un defecto de dónde está la marca y no de qué dice.
#
# Los elementos se localizan por los identificadores que declara la spec.

# Los casos, tal y como los cita `test/spec-test-map.json`:
#   «La espera de la posición se dice y desaparece siempre»
#   «El punto de partida declara de qué puerta salió»
#
appId: com.walkingadventure.app
---
# A la portada se llega saliendo del arranque, que hoy es el único camino.
- runFlow:
    file: arranque.yaml

- assertVisible:
    id: 'portada'

# Antes de tocar nada: no hay ninguna salida abierta, así que no hay ni espera ni marcas del
# anclaje. Es lo que hace que su aparición después signifique algo.
- assertNotVisible:
    id: 'salida-buscando'
- assertNotVisible:
    id: 'salida-punto-origen'
- assertNotVisible:
    id: 'salida-reanclaje'
- assertVisible:
    id: 'salir-sin-mas'

# ── La espera de la posición se dice y desaparece siempre ─────────────────────
# Se toca «Salir a andar sin más» y se espera al desenlace, que es de las dos maneras: hacia
# el momento en marcha si la salida se abre, o de vuelta a la portada con el motivo debajo.
# La espera está acotada por un tope de diez segundos, así que treinta de margen sobran.

- tapOn:
    id: 'salir-sin-mas'

- extendedWaitUntil:
    visible:
      id: 'salida-situacion'
    timeout: 30000

# **La línea de espera no se queda colgada**, termine como termine la apertura. Una espera que
# no desaparece es peor que no tenerla: se lee como una app que se quedó pensando.
- assertNotVisible:
    id: 'salida-buscando'
- assertNotVisible: 'Buscando dónde estás…'
# Y mientras dura no lleva ninguna cifra, que es la disciplina de `lenguaje.md`: una cuenta
# atrás convierte el tope en una promesa que el sistema no garantiza.
- assertNotVisible: '%'
- assertNotVisible: 'por ciento'

# ── El punto de partida declara de qué puerta salió ───────────────────────────
# Las dos marcas del anclaje solo existen con una salida abierta, y su vocabulario es cerrado:
# `puntual` o `ultima-conocida` para el origen, `sin-reanclar` o `reanclada` para el otro.
# Sin ellas, que la apertura cayera al respaldo solo se podía deducir de que la salida se
# abrió, y el re-anclaje no se podía afirmar sobre el aparato de ninguna manera.

- runFlow:
    when:
      visible:
        id: 'salida-punto-origen'
    commands:
      - assertVisible:
          id: 'salida-punto-origen'
      # Una de las dos puertas, y ninguna palabra nueva: `sin-declarar` querría decir que la
      # apertura no anotó de dónde salió su punto, que es lo que esta fila viene a arreglar.
      - assertNotVisible: 'sin-declarar'
      - assertVisible:
          id: 'salida-reanclaje'

# ── Y si la salida no se abrió, se dice con su motivo y sin espera colgada ─────
# El otro desenlace, que es igual de válido: el motivo literal debajo de la acción, la acción
# de vuelta y **ninguna línea de espera puesta**. No se fuerza ninguno de los dos caminos:
# cuál ocurre depende de lo que el proveedor entregue, y eso no lo gobierna este flujo.

- runFlow:
    when:
      visible:
        id: 'salida-no-se-abre'
    commands:
      - assertNotVisible:
          id: 'salida-buscando'
      - assertVisible:
          id: 'salir-sin-mas'
      # El permiso está concedido, así que el motivo no puede ser el del permiso: eso era la
      # marca que mentía antes de esta fila, y es justo lo que se arregló.
      - assertNotVisible: 'permiso-denegado'
